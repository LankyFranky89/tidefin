name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Optional: repository secrets TIDEFIN_KEYSTORE_B64 + TIDEFIN_KEYSTORE_PASSWORD keep one
      # signing key, so new versions install over the old one.
      - name: Signing key
        env:
          KS_B64: ${{ secrets.TIDEFIN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/tidefin.keystore"
          else
            echo "No signing secret set - using a temporary key (uninstall before installing a newer build)."
            keytool -genkeypair -keystore "$RUNNER_TEMP/tidefin.keystore" -storepass temporary -keypass temporary \
              -alias tidefin -dname "CN=Tidefin" -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "TIDEFIN_KEYSTORE_FILE=$RUNNER_TEMP/tidefin.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.TIDEFIN_KEYSTORE_PASSWORD }}
        run: |
          export TIDEFIN_KEYSTORE_PASSWORD="${KS_PASS:-temporary}"
          gradle -p android assembleRelease --stacktrace --no-daemon

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk Tidefin.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Tidefin for Android 1.0.${{ github.run_number }}
          body: Install Tidefin.apk on your phone.
          files: Tidefin.apk
          make_latest: 'true'
