<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tidefin</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d10;color:#eef1f5;font-family:"LG Smart UI","Segoe UI",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  .logo{font-size:96px;font-weight:800;letter-spacing:-2px}.logo b{color:#3ee0c5}
  #msg{font-size:30px;color:#9aa2b0;margin:18px 0 40px;text-align:center;max-width:1100px}
  form{display:none;flex-direction:column;gap:14px;width:900px}
  label{font-size:24px;color:#9aa2b0;margin-top:10px}
  input{font-size:30px;padding:18px 24px;border-radius:16px;border:3px solid #262b33;background:#15181d;color:#eef1f5;outline:none}
  .row{display:flex;gap:20px;margin-top:26px}
  button{font-size:28px;font-weight:700;padding:20px 44px;border-radius:40px;border:3px solid transparent;background:#1c2027;color:#eef1f5}
  button.main{background:#3ee0c5;color:#04201b}
  .f{border-color:#3ee0c5!important;box-shadow:0 0 0 6px rgba(62,224,197,.25);transform:scale(1.04)}
  .spin{width:56px;height:56px;border:6px solid #262b33;border-top-color:#3ee0c5;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="logo">Tide<b>fin</b></div>
  <div id="msg">Connecting…</div>
  <div class="spin" id="spin"></div>
  <form id="f" onsubmit="return false">
    <label for="home">Tidefin address at home</label>
    <input id="home" placeholder="192.168.1.185:8585">
    <label for="remote">Tailscale address (optional)</label>
    <input id="remote" placeholder="100.x.y.z:8585">
    <div class="row"><button class="main" id="save">Save and connect</button><button id="retry">Try again</button></div>
  </form>
<script>
  // Opens your Tidefin server in TV mode. Remembers the address; tries home first, then Tailscale.
  var DEFAULT_HOME = 'http://192.168.1.185:8585';
  function norm(v) {
    v = (v || '').trim().replace(/\/+$/, '');
    if (!v) return '';
    if (!/^https?:\/\//.test(v)) v = 'http://' + v;
    var host = v.split('://')[1].split('/')[0];
    if (host.indexOf(':') < 0) v = v.replace(host, host + ':8585');
    return v;
  }
  function get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function reachable(base, ms) {
    return new Promise(function (resolve) {
      if (!base) return resolve(false);
      var done = false, t = setTimeout(function () { if (!done) { done = true; resolve(false); } }, ms);
      fetch(base + '/api/health', { mode: 'no-cors', cache: 'no-store' })
        .then(function () { if (!done) { done = true; clearTimeout(t); resolve(true); } })
        .catch(function () { if (!done) { done = true; clearTimeout(t); resolve(false); } });
    });
  }
  function open(base) { location.replace(base + '/?tv=1'); }
  function showForm(text) {
    document.getElementById('msg').textContent = text;
    document.getElementById('spin').style.display = 'none';
    var f = document.getElementById('f'); f.style.display = 'flex';
    document.getElementById('home').value = get('tfHome', DEFAULT_HOME).replace('http://', '');
    document.getElementById('remote').value = get('tfRemote', '').replace('http://', '');
    focusAt(2);
  }
  function connect() {
    document.getElementById('msg').textContent = 'Connecting…';
    document.getElementById('spin').style.display = 'block';
    document.getElementById('f').style.display = 'none';
    var home = get('tfHome', DEFAULT_HOME), remote = get('tfRemote', '');
    reachable(home, 2500).then(function (ok) {
      if (ok) return open(home);
      return reachable(remote, 6000).then(function (ok2) {
        if (ok2) return open(remote);
        showForm("Can't reach Tidefin. Check the address below, or that the NAS is on.");
      });
    });
  }
  // remote-control navigation for the settings form
  var order = ['home', 'remote', 'save', 'retry'], idx = 0;
  function focusAt(i) {
    idx = (i + order.length) % order.length;
    order.forEach(function (id) { document.getElementById(id).classList.remove('f'); });
    var el = document.getElementById(order[idx]); el.classList.add('f'); el.focus();
  }
  document.addEventListener('keydown', function (e) {
    var formOpen = document.getElementById('f').style.display === 'flex';
    if (e.keyCode === 461 || e.key === 'GoBack') { // Back on the remote: leave the app
      e.preventDefault();
      var s = window.webOSSystem || window.PalmSystem;
      if (s && s.platformBack) s.platformBack(); else window.close();
      return;
    }
    if (!formOpen) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); focusAt(idx + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); focusAt(idx - 1); }
    else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && idx >= 2) { e.preventDefault(); focusAt(idx === 2 ? 3 : 2); }
    else if (e.key === 'Enter' && idx >= 2) { e.preventDefault(); document.getElementById(order[idx]).click(); }
  });
  document.getElementById('save').onclick = function () {
    set('tfHome', norm(document.getElementById('home').value) || DEFAULT_HOME);
    set('tfRemote', norm(document.getElementById('remote').value));
    connect();
  };
  document.getElementById('retry').onclick = connect;
  connect();
</script>
</body>
</html>
