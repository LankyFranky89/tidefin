<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Tidefin</title>
<style>
body{margin:0;height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#123a3a,#0b0f14 60%);color:#e8eef2;font:15px "Segoe UI",system-ui,sans-serif}
.box{width:min(460px,90vw);padding:32px;border-radius:20px;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1)}
h1{margin:0 0 6px;font-size:26px}p{color:#9fb0bb;margin:0 0 20px;line-height:1.5}
label{font-size:13px;color:#9fb0bb}input{width:100%;box-sizing:border-box;margin:6px 0 18px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);color:#fff;font-size:15px}
button{width:100%;padding:12px;border:0;border-radius:12px;background:#1ed6b0;color:#04221c;font-weight:600;font-size:15px;cursor:pointer}
.err{background:rgba(255,80,80,.15);color:#ffb4b4;padding:10px 12px;border-radius:10px;margin-bottom:16px;font-size:13px}
</style></head><body>
<form class="box" id="f">
  <h1>Tidefin</h1>
  <p>Enter the address of Tidefin on your NAS. Use the Tailscale address if this PC is away from home.</p>
  <div class="err" id="err" hidden></div>
  <label for="u">NAS address</label>
  <input id="u" autofocus spellcheck="false">
  <button>Connect</button>
</form>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('u').value = q.get('server') || 'http://192.168.1.185:8585';
if (q.get('error')) { const e = document.getElementById('err'); e.textContent = q.get('error'); e.hidden = false; }
document.getElementById('f').onsubmit = (ev) => {
  ev.preventDefault();
  let u = document.getElementById('u').value.trim();
  if (!/^https?:\/\//.test(u)) u = 'http://' + u;
  location.href = 'tidefin-save:?url=' + encodeURIComponent(u);
};
</script>
</body></html>
