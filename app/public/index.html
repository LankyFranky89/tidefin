<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Tidefin</title>
<style>
:root{--bg:#0d0f12;--panel:#15181d;--panel2:#1c2027;--line:#262b33;--text:#e9ecf1;--dim:#8b93a1;--accent:#3ee0c5;--accent2:#1fb59c;--err:#ff6b6b;--ok:#5ad67d;--r:10px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-weight:700;font-size:18px;letter-spacing:.3px}.logo b{color:var(--accent)}
nav{display:flex;gap:4px}
nav button{padding:7px 14px;border-radius:999px;color:var(--dim)}nav button.on{background:var(--panel2);color:var(--text)}
.search{flex:1;max-width:460px;margin-left:auto}
.search input{width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:var(--accent)}
.dots{display:flex;gap:10px;font-size:12px;color:var(--dim)}.dot::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--err);margin-right:5px}.dot.up::before{background:var(--ok)}
main{flex:1;overflow:auto;padding:20px 20px 120px}
h2{font-size:15px;margin:22px 0 12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:10px}
h2 .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);text-transform:none;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{cursor:pointer;min-width:0}.card .art{aspect-ratio:1;border-radius:var(--r);background:var(--panel2) center/cover;position:relative;overflow:hidden}
.card:hover .art{outline:2px solid var(--accent)}
.card .t{margin-top:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .a{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:#000a;color:var(--accent)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:32px 44px 1fr auto auto 40px;align-items:center;gap:12px;padding:6px 10px;border-radius:8px}
.row:hover{background:var(--panel)}.row.playing{background:var(--panel2)}.row.playing .rt{color:var(--accent)}
.row .n{color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
.row .th{width:44px;height:44px;border-radius:6px;background:var(--panel2) center/cover}
.row .rt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .ra{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:var(--dim);font-variant-numeric:tabular-nums;font-size:13px}
.e{font-size:9px;padding:1px 4px;border-radius:3px;background:var(--dim);color:var(--bg);font-weight:700;margin-left:6px;vertical-align:2px}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}.ib:hover{background:var(--panel2);color:var(--text)}
.ib svg{width:18px;height:18px}
.dl.queued{color:var(--accent)}.dl.done{color:var(--ok)}.dl.err{color:var(--err)}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.hero{display:flex;gap:24px;align-items:flex-end;margin-bottom:20px}
.hero .art{width:200px;height:200px;border-radius:var(--r);background:var(--panel2) center/cover;flex:none}
.hero h1{margin:4px 0;font-size:30px}.hero .meta{color:var(--dim)}
.btn{padding:9px 18px;border-radius:999px;background:var(--accent);color:#04201b;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.btn.sec{background:var(--panel2);color:var(--text)}.btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.back{color:var(--dim);margin-bottom:14px}.back:hover{color:var(--text)}
.empty{color:var(--dim);padding:30px 0;text-align:center}
.qrow{display:grid;grid-template-columns:1fr 140px 110px;gap:12px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
.st{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel2);justify-self:start}
.st.finished{color:var(--ok)}.st.error{color:var(--err)}.st.download,.st.processing{color:var(--accent)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:20px;align-items:center}
.np{display:flex;gap:12px;align-items:center;min-width:0}.np .th{width:52px;height:52px;border-radius:6px;background:var(--panel2) center/cover;flex:none}
.np .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np .a{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(520px,44vw)}
.ctl .b{display:flex;gap:10px;align-items:center}
.play{width:42px;height:42px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center}.play svg{width:20px;height:20px}
.seek{display:flex;gap:10px;align-items:center;width:100%;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--accent)}
.right{display:flex;justify-content:flex-end;align-items:center;gap:8px}.right input{max-width:110px}
.src{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--panel2);color:var(--accent);margin-left:6px}
.toast{position:fixed;right:20px;bottom:100px;background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:360px}
.toast.show{opacity:1;transform:none}.toast.err{border-color:var(--err)}
/* ---------- full-screen now playing ---------- */
.np{cursor:pointer}
#fs{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;color:#fff;
 background:linear-gradient(180deg,var(--fs1,#2a3340) 0%,var(--fs2,#151a20) 55%,#0b0d10 100%);
 transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1),background 1s;overflow:hidden;touch-action:pan-y}
#fs.open{transform:none}
#fs.drag{transition:none}
#fs .top{display:flex;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top)) 16px 4px;position:relative}
#fs .grab{width:42px;height:5px;border-radius:3px;background:#ffffff55}
#fs .from{position:absolute;left:0;right:0;top:calc(22px + env(safe-area-inset-top));text-align:center;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#ffffffaa;pointer-events:none}
#fs .body{flex:1;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:28px 24px calc(20px + env(safe-area-inset-bottom))}
#fs .cover{width:min(84vw,46vh,520px);aspect-ratio:1;border-radius:14px;background:#ffffff14 center/cover;box-shadow:0 24px 60px #0009;flex:none;transition:transform .3s}
#fs.paused .cover{transform:scale(.94)}
#fs .meta{width:min(84vw,520px);margin-top:26px;display:flex;align-items:center;gap:12px}
#fs .meta>div{flex:1;min-width:0}
#fs .ft{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fs .fa{font-size:16px;color:#ffffffcc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fs .falb{font-size:14px;color:#ffffff99;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:100%}
#fs .falb:hover{color:#fff;text-decoration:underline}
#fs .ib{color:#ffffffcc}#fs .ib:hover{background:#ffffff1f;color:#fff}
#fs .ib.on{color:var(--accent)}
#fs .ib.dl.done{color:var(--ok)}#fs .ib.dl.err{color:var(--err)}
#fs .fseek{width:min(84vw,520px);margin-top:18px}
#fs .fseek input{width:100%;accent-color:#fff}
#fs .times{display:flex;justify-content:space-between;font-size:12px;color:#ffffffaa;font-variant-numeric:tabular-nums}
#fs .fctl{width:min(84vw,520px);display:flex;align-items:center;justify-content:space-between;margin-top:10px}
#fs .fctl .big{width:68px;height:68px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center}
#fs .fctl .big svg{width:30px;height:30px}
#fs .fctl .ib{width:48px;height:48px}#fs .fctl .ib svg{width:26px;height:26px}
#fs .fctl .sm svg{width:20px;height:20px}
#fs .rep1{position:relative}#fs .rep1::after{content:"1";position:absolute;font-size:9px;font-weight:800;right:9px;top:9px}
#fs .upnext{width:min(84vw,520px);margin-top:34px}
#fs .upnext h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#ffffffaa;margin:0 0 8px}
#fs .qi{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}
#fs .qi:hover{background:#ffffff14}
#fs .qi .th{width:40px;height:40px;border-radius:5px;background:#ffffff14 center/cover}
#fs .qi .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fs .qi .a{font-size:13px;color:#ffffffaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fs .qi .d{font-size:12px;color:#ffffff88;font-variant-numeric:tabular-nums}
#fs .none{color:#ffffff88;font-size:14px;padding:8px}
@media(min-width:900px) and (min-aspect-ratio:4/3){
 #fs .body{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,440px);gap:56px;align-items:center;padding:20px 6vw 40px;overflow:hidden}
 #fs .left{display:flex;flex-direction:column;align-items:center}
 #fs .cover{width:min(40vw,62vh,560px)}
 #fs .meta,#fs .fseek,#fs .fctl{width:min(40vw,62vh,560px)}
 #fs .upnext{width:100%;margin:0;max-height:78vh;overflow:auto;background:#00000033;border-radius:14px;padding:16px}
}
@media(max-width:899px),(max-aspect-ratio:4/3){ #fs .left{display:contents} }
@media(max-width:760px){
 header{flex-wrap:wrap;padding:10px 12px}.search{order:3;max-width:none;flex-basis:100%}.dots{display:none}
 main{padding:14px 12px 150px}.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
 .row{grid-template-columns:44px 1fr auto 36px;gap:10px}.row .n,.row .d{display:none}
 .hero{flex-direction:column;align-items:flex-start}.hero .art{width:150px;height:150px}
 footer{grid-template-columns:1fr auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}.right{display:none}.ctl{width:auto}.seek{display:none}
 .qrow{grid-template-columns:1fr 100px}.qrow .bar{display:none}
}
</style>
</head>
<body>
<header>
  <div class="logo">Tide<b>fin</b></div>
  <nav>
    <button data-v="library" class="on">Library</button>
    <button data-v="search">Search</button>
    <button data-v="downloads">Downloads</button>
  </nav>
  <div class="search"><input id="q" type="search" placeholder="Search your library and Tidal…" autocomplete="off"></div>
  <div class="dots"><span class="dot" id="h-jf">Jellyfin</span><span class="dot" id="h-td">Tidarr</span><span class="dot" id="h-ti">Tidal</span></div>
</header>
<main id="main"></main>
<footer>
  <div class="np"><div class="th" id="np-th"></div><div style="min-width:0"><div class="t" id="np-t">Nothing playing</div><div class="a" id="np-a"></div></div></div>
  <div class="ctl">
    <div class="b">
      <button class="ib" id="prev" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
      <button class="play" id="pp" title="Play/Pause"></button>
      <button class="ib" id="next" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
    <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  </div>
  <div class="right">
    <button class="ib dl" id="np-dl" title="Download to library" hidden></button>
    <svg viewBox="0 0 24 24" width="18" fill="currentColor" style="color:var(--dim)"><path d="M3 10v4h4l5 5V5L7 10zm13.5 2A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    <input type="range" id="vol" min="0" max="100" value="90">
  </div>
</footer>
<div id="fs" aria-hidden="true">
  <div class="top"><div class="grab"></div><div class="from" id="fs-from"></div></div>
  <div class="body">
    <div class="left">
      <div class="cover" id="fs-cover"></div>
      <div class="meta">
        <div><div class="ft" id="fs-t"></div><div class="fa" id="fs-a"></div><span class="falb" id="fs-alb"></span></div>
        <button class="ib dl" id="fs-dl" title="Download to library" hidden></button>
      </div>
      <div class="fseek"><input type="range" id="fs-seek" min="0" max="1000" value="0"><div class="times"><span id="fs-cur">0:00</span><span id="fs-dur">0:00</span></div></div>
      <div class="fctl">
        <button class="ib sm" id="fs-shuf" title="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button class="ib" id="fs-prev" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
        <button class="big" id="fs-pp" title="Play/Pause"></button>
        <button class="ib" id="fs-next" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
        <button class="ib sm" id="fs-rep" title="Repeat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
      </div>
    </div>
    <div class="upnext"><h3>Up next</h3><div id="fs-q"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<audio id="audio" preload="auto"></audio>
<script>
const $ = (s, el = document) => el.querySelector(s);
const main = $('#main'), audio = $('#audio');
const I = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
  dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>',
  wait: '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  err: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 7v6m0 4v.01"/></svg>',
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (s) => { if (!s && s !== 0 || !isFinite(s)) return '–'; s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const jfImg = (id, h = 300) => id ? `url('/api/library/image/${id}?h=${h}')` : 'none';
const bg = (u) => u ? `url('${u.replace(/'/g, '%27')}')` : 'none';

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
let toastT;
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 3500); }

// ---------- download state (Tidal id -> status) ----------
const dlState = new Map(); // id -> 'queued' | 'done' | 'err'
const STATUS_MAP = { queue_download: 'queued', download: 'queued', queue_processing: 'queued', processing: 'queued', finished: 'done', error: 'err' };
function dlIcon(id) { const s = dlState.get(String(id)); return s === 'queued' ? I.wait : s === 'done' ? I.ok : s === 'err' ? I.err : I.dl; }
function dlClass(id) { return 'ib dl ' + (dlState.get(String(id)) || ''); }
function refreshDlButtons() {
  document.querySelectorAll('[data-dl]').forEach((b) => { const id = b.dataset.dl; b.className = dlClass(id); b.innerHTML = dlIcon(id); });
  updateNowDl();
}
async function download(type, id, title, artist) {
  id = String(id);
  if (dlState.get(id) === 'queued' || dlState.get(id) === 'done') return toast(dlState.get(id) === 'done' ? 'Already downloaded' : 'Already in the queue');
  dlState.set(id, 'queued'); refreshDlButtons();
  try {
    await api('/api/download', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type, id, title, artist }) });
    toast(`Sent to Tidarr: ${title}`);
    pollQueue(true);
  } catch (e) { dlState.set(id, 'err'); refreshDlButtons(); toast('Download failed: ' + e.message, true); }
}
let queueCache = [], pollTimer = null;
async function pollQueue(force) {
  clearTimeout(pollTimer);
  try {
    const { items } = await api('/api/queue');
    queueCache = items;
    for (const it of items) { const s = STATUS_MAP[it.status]; if (s) dlState.set(String(it.id), s); }
    refreshDlButtons();
    if (view.name === 'downloads') renderDownloads();
    const busy = items.some((i) => STATUS_MAP[i.status] === 'queued');
    pollTimer = setTimeout(pollQueue, busy ? 3000 : 15000);
  } catch { pollTimer = setTimeout(pollQueue, 15000); }
}

// ---------- player ----------
let queue = [], qi = -1, origQueue = null, shuffle = false, repeat = 'off'; // repeat: off | all | one
try { shuffle = localStorage.tfShuf === '1'; if (['off', 'all', 'one'].includes(localStorage.tfRep)) repeat = localStorage.tfRep; } catch {}
function shuffled(list, keep) {
  const rest = list.filter((_, i) => i !== keep);
  for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
  return [list[keep], ...rest];
}
function playList(list, i) {
  origQueue = list.slice();
  if (shuffle) { queue = shuffled(list, i); qi = 0; } else { queue = list.slice(); qi = i; }
  loadCurrent();
}
function setShuffle(on) {
  shuffle = on; try { localStorage.tfShuf = on ? '1' : '0'; } catch {}
  const cur = queue[qi];
  if (cur && origQueue) {
    if (on) { queue = shuffled(queue, qi); qi = 0; }
    else { queue = origQueue.slice(); qi = Math.max(0, queue.indexOf(cur)); }
  }
  renderFs();
}
function nextTrack(auto) {
  if (auto && repeat === 'one') { audio.currentTime = 0; audio.play().catch(() => {}); return; }
  if (qi < queue.length - 1) { qi++; loadCurrent(); }
  else if (repeat === 'all' && queue.length) { qi = 0; loadCurrent(); }
}
function loadCurrent() {
  const t = queue[qi]; if (!t) return;
  audio.src = t.src === 'tidal' ? `/api/tidal/stream/${t.id}` : `/api/library/stream/${t.id}`;
  audio.play().catch(() => {});
  $('#np-t').innerHTML = esc(t.title) + (t.src === 'tidal' ? '<span class="src">TIDAL</span>' : '');
  $('#np-a').textContent = [t.artist, t.album].filter(Boolean).join(' — ');
  $('#np-th').style.backgroundImage = t.src === 'tidal' ? bg(t.cover) : jfImg(t.imageId, 120);
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.album || '' });
  }
  updateNowDl(); markPlaying(); renderFs();
}
function updateNowDl() {
  const t = queue[qi], b = $('#np-dl');
  if (!t || t.src !== 'tidal') { b.hidden = true; return; }
  b.hidden = false; b.dataset.dl = t.id; b.className = dlClass(t.id); b.innerHTML = dlIcon(t.id);
  b.onclick = () => download('track', t.id, t.title, t.artist);
}
function markPlaying() {
  const t = queue[qi];
  document.querySelectorAll('.row[data-key]').forEach((r) => r.classList.toggle('playing', !!t && r.dataset.key === `${t.src}:${t.id}`));
}
const setPP = () => { $('#pp').innerHTML = audio.paused ? I.play : I.pause; $('#fs-pp').innerHTML = audio.paused ? I.play : I.pause; $('#fs').classList.toggle('paused', audio.paused); };
setPP();
$('#pp').onclick = () => { if (!audio.src) return; audio.paused ? audio.play() : audio.pause(); };
$('#next').onclick = () => nextTrack(false);
$('#prev').onclick = () => { if (audio.currentTime > 3 || qi <= 0) audio.currentTime = 0; else { qi--; loadCurrent(); } };
audio.onplay = audio.onpause = setPP;
audio.onended = () => nextTrack(true);
audio.onerror = () => { const t = queue[qi]; if (t) toast(t.src === 'tidal' ? 'Tidal playback failed — you can still download it' : 'Could not play this file', true); };
audio.ontimeupdate = () => {
  const c = fmt(audio.currentTime), d = fmt(audio.duration);
  $('#cur').textContent = c; $('#dur').textContent = d; $('#fs-cur').textContent = c; $('#fs-dur').textContent = d;
  if (!seeking && audio.duration) { const v = audio.currentTime / audio.duration * 1000; $('#seek').value = v; $('#fs-seek').value = v; }
};
let seeking = false;
$('#seek').oninput = () => seeking = true;
$('#seek').onchange = (e) => { if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; seeking = false; };
$('#fs-seek').oninput = () => seeking = true;
$('#fs-seek').onchange = $('#seek').onchange;

// ---------- full-screen now playing ----------
const fs = $('#fs');
const coverUrl = (t, size) => t.src === 'tidal' ? (t.cover ? '/api/img?u=' + encodeURIComponent(t.cover) : null) : (t.imageId ? `/api/library/image/${t.imageId}?h=${size}` : null);
let lastColorKey = '';
function applyColors(url) {
  if (!url || url === lastColorKey) return;
  lastColorKey = url;
  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 24;
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, 24, 24);
      const px = x.getImageData(0, 0, 24, 24).data;
      // weighted average favouring saturated, mid-bright pixels
      let r = 0, g = 0, b = 0, w = 0;
      for (let i = 0; i < px.length; i += 4) {
        const R = px[i], G = px[i + 1], B = px[i + 2], mx = Math.max(R, G, B), mn = Math.min(R, G, B);
        const sat = mx ? (mx - mn) / mx : 0, lum = mx / 255;
        const wt = 0.15 + sat * 2 * (lum > 0.12 && lum < 0.95 ? 1 : 0.2);
        r += R * wt; g += G * wt; b += B * wt; w += wt;
      }
      r /= w; g /= w; b /= w;
      const k = 150 / Math.max(r, g, b, 1); // normalise brightness so dark covers still get colour
      const c1 = `rgb(${Math.min(255, r * k * .75) | 0},${Math.min(255, g * k * .75) | 0},${Math.min(255, b * k * .75) | 0})`;
      const c2 = `rgb(${r * k * .32 | 0},${g * k * .32 | 0},${b * k * .32 | 0})`;
      fs.style.setProperty('--fs1', c1); fs.style.setProperty('--fs2', c2);
    } catch { /* cross-origin image: keep default colours */ }
  };
  img.src = url;
}
function renderFs() {
  const t = queue[qi];
  if (!t) return;
  const big = coverUrl(t, 800);
  $('#fs-cover').style.backgroundImage = big ? `url('${big}')` : 'none';
  $('#fs-t').innerHTML = esc(t.title) + (t.explicit ? '<span class="e">E</span>' : '');
  $('#fs-a').textContent = t.artist || '';
  $('#fs-alb').textContent = t.album || '';
  $('#fs-alb').style.display = t.album && t.albumId ? '' : (t.album ? '' : 'none');
  $('#fs-from').textContent = t.src === 'tidal' ? 'Playing from Tidal' : 'Playing from your library';
  const dl = $('#fs-dl');
  if (t.src === 'tidal') { dl.hidden = false; dl.dataset.dl = t.id; dl.className = dlClass(t.id); dl.innerHTML = dlIcon(t.id); dl.onclick = () => download('track', t.id, t.title, t.artist); }
  else dl.hidden = true;
  $('#fs-shuf').classList.toggle('on', shuffle);
  const rb = $('#fs-rep'); rb.classList.toggle('on', repeat !== 'off'); rb.classList.toggle('rep1', repeat === 'one');
  rb.title = { off: 'Repeat: off', all: 'Repeat: all', one: 'Repeat: one' }[repeat];
  const up = queue.slice(qi + 1);
  $('#fs-q').innerHTML = up.length ? up.slice(0, 100).map((u, k) => `
    <div class="qi" data-q="${qi + 1 + k}"><div class="th" style="background-image:${coverUrl(u, 100) ? `url('${coverUrl(u, 100)}')` : 'none'}"></div>
    <div style="min-width:0"><div class="t">${esc(u.title)}</div><div class="a">${esc(u.artist || '')}</div></div><div class="d">${fmt(u.duration)}</div></div>`).join('')
    : `<div class="none">${repeat === 'all' && queue.length > 1 ? 'Starts over from the first song' : 'Nothing queued after this song'}</div>`;
  $('#fs-q').querySelectorAll('[data-q]').forEach((el) => el.onclick = () => { qi = +el.dataset.q; loadCurrent(); });
  if (fs.classList.contains('open')) applyColors(coverUrl(t, 100));
  setPP();
}
function openFs() {
  if (!queue[qi] || fs.classList.contains('open')) return;
  fs.classList.add('open'); fs.setAttribute('aria-hidden', 'false');
  renderFs(); applyColors(coverUrl(queue[qi], 100));
  history.pushState({ tfFs: 1 }, '');
}
function closeFs(fromPop) {
  if (!fs.classList.contains('open')) return;
  fs.classList.remove('open'); fs.setAttribute('aria-hidden', 'true'); fs.style.transform = '';
  if (!fromPop && history.state && history.state.tfFs) history.back();
}
window.addEventListener('popstate', () => closeFs(true));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFs(); });
$('.np').addEventListener('click', openFs);
$('#fs-pp').onclick = () => $('#pp').onclick();
$('#fs-next').onclick = () => nextTrack(false);
$('#fs-prev').onclick = () => $('#prev').onclick();
$('#fs-shuf').onclick = () => setShuffle(!shuffle);
$('#fs-rep').onclick = () => { repeat = { off: 'all', all: 'one', one: 'off' }[repeat]; try { localStorage.tfRep = repeat; } catch {} renderFs(); };
$('#fs-alb').onclick = () => {
  const t = queue[qi]; if (!t || !t.albumId) return;
  closeFs(); setTimeout(() => go(t.src === 'tidal' ? 'tidalAlbum' : 'album', { id: t.albumId }), 50);
};
// swipe down to close
let dragY = null, dragStart = 0;
fs.addEventListener('touchstart', (e) => {
  const body = fs.querySelector('.body');
  if (e.target.closest('input[type=range]')) return;
  if (body.scrollTop > 0 && !e.target.closest('.top')) return;   // let the queue scroll first
  dragY = e.touches[0].clientY; dragStart = Date.now();
}, { passive: true });
fs.addEventListener('touchmove', (e) => {
  if (dragY === null) return;
  const dy = e.touches[0].clientY - dragY;
  if (dy > 0) { fs.classList.add('drag'); fs.style.transform = `translateY(${dy}px)`; }
}, { passive: true });
fs.addEventListener('touchend', (e) => {
  if (dragY === null) return;
  const dy = e.changedTouches[0].clientY - dragY, fast = dy > 60 && Date.now() - dragStart < 250;
  fs.classList.remove('drag'); dragY = null;
  if (dy > 140 || fast) closeFs(); else fs.style.transform = '';
});
$('#vol').oninput = (e) => { audio.volume = e.target.value / 100; try { localStorage.tfVol = e.target.value; } catch {} };
try { if (localStorage.tfVol) { $('#vol').value = localStorage.tfVol; audio.volume = localStorage.tfVol / 100; } } catch {}
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('nexttrack', () => $('#next').onclick());
  navigator.mediaSession.setActionHandler('previoustrack', () => $('#prev').onclick());
}
document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); $('#pp').onclick(); } });

// ---------- rendering ----------
function trackRows(list, { showThumb = true, numbered = false } = {}) {
  if (!list.length) return '<div class="empty">No tracks</div>';
  return '<div class="rows">' + list.map((t, i) => `
    <div class="row" data-key="${t.src}:${esc(t.id)}" data-i="${i}">
      <div class="n">${numbered ? (t.number || i + 1) : i + 1}</div>
      <div class="th" style="background-image:${showThumb ? (t.src === 'tidal' ? bg(t.cover) : jfImg(t.imageId, 100)) : 'none'}"></div>
      <div style="min-width:0"><div class="rt">${esc(t.title)}${t.explicit ? '<span class="e">E</span>' : ''}</div><div class="ra">${esc(t.artist)}${t.album ? ' — ' + esc(t.album) : ''}</div></div>
      <div class="d">${fmt(t.duration)}</div>
      <button class="ib" data-play="${i}" title="Play">${I.play}</button>
      ${t.src === 'tidal' ? `<button class="${dlClass(t.id)}" data-dl="${esc(t.id)}" data-i="${i}" title="Download to library">${dlIcon(t.id)}</button>` : '<span></span>'}
    </div>`).join('') + '</div>';
}
function bindRows(el, list) {
  el.querySelectorAll('.row').forEach((r) => r.addEventListener('dblclick', () => playList(list, +r.dataset.i)));
  el.querySelectorAll('[data-play]').forEach((b) => b.onclick = () => playList(list, +b.dataset.play));
  el.querySelectorAll('[data-dl][data-i]').forEach((b) => b.onclick = () => { const t = list[+b.dataset.i]; download('track', t.id, t.title, t.artist); });
  markPlaying();
}
function albumCards(list, src) {
  if (!list.length) return '<div class="empty">No albums</div>';
  return '<div class="grid">' + list.map((a, i) => `
    <div class="card" data-alb="${i}">
      <div class="art" style="background-image:${src === 'tidal' ? bg(a.cover) : (a.hasImage ? jfImg(a.id) : 'none')}">${src === 'tidal' ? '<span class="badge">TIDAL</span>' : ''}</div>
      <div class="t">${esc(a.title)}</div><div class="a">${esc(a.artist)}${a.year ? ' · ' + a.year : ''}</div>
    </div>`).join('') + '</div>';
}
function bindCards(el, list, src) {
  el.querySelectorAll('[data-alb]').forEach((c) => c.onclick = () => go(src === 'tidal' ? 'tidalAlbum' : 'album', { id: list[+c.dataset.alb].id }));
}

let view = { name: 'library' }, history_ = [];
function go(name, args = {}, push = true) {
  if (push) history_.push(view);
  view = { name, ...args };
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.v === name || (name === 'album' && b.dataset.v === 'library') || (name === 'tidalAlbum' && b.dataset.v === 'search')));
  main.scrollTop = 0;
  ({ library: renderLibrary, search: renderSearch, downloads: renderDownloads, album: renderAlbum, tidalAlbum: renderTidalAlbum })[name]();
}
const backBtn = () => history_.length ? '<button class="back" id="back">← Back</button>' : '';
const bindBack = () => { const b = $('#back'); if (b) b.onclick = () => { const v = history_.pop(); go(v.name, v, false); }; };
const loading = () => main.innerHTML = '<div class="empty">Loading…</div>';
const errBox = (e) => `<div class="empty" style="color:var(--err)">${esc(e.message)}</div>`;

const SORT_LABELS = { recent: 'Recently added', artist: 'Artist', name: 'Album A–Z', year: 'Year' };
let libSort = 'recent';
try { if (SORT_LABELS[localStorage.tfSort]) libSort = localStorage.tfSort; } catch {}
// Album grid grouped under artist headings when sorting by artist
function artistGroups(albums) {
  let html = '', cur = null, buf = [];
  const flush = () => { if (buf.length) html += `<h2 style="text-transform:none;letter-spacing:0;font-size:17px;color:var(--text)">${esc(cur || 'Unknown artist')} <span class="tag">${buf.length}</span></h2>` + albumCardsIdx(buf); buf = []; };
  albums.forEach((a, i) => { const k = a.artist || ''; if (k !== cur) { flush(); cur = k; } buf.push([a, i]); });
  flush(); return html;
}
function albumCardsIdx(pairs) {
  return '<div class="grid">' + pairs.map(([a, i]) => `
    <div class="card" data-alb="${i}">
      <div class="art" style="background-image:${a.hasImage ? jfImg(a.id) : 'none'}"></div>
      <div class="t">${esc(a.title)}</div><div class="a">${a.year || ''}</div>
    </div>`).join('') + '</div>';
}
async function renderLibrary() {
  loading();
  try {
    let { albums, total } = await api(`/api/library/albums?sort=${libSort}`);
    const draw = () => libSort === 'artist' ? artistGroups(albums) : albumCards(albums, 'jf');
    main.innerHTML = `
      <h2>Your library <span class="tag">${total} albums</span>
        <span style="margin-left:auto;display:flex;gap:6px">
          <select id="sort" class="btn sec" style="border:0;appearance:auto">${Object.entries(SORT_LABELS).map(([k, v]) => `<option value="${k}"${k === libSort ? ' selected' : ''}>${v}</option>`).join('')}</select>
          <button class="btn sec" id="scan" title="Ask Jellyfin to rescan">Rescan</button>
        </span></h2>
      <div id="alb">${draw()}</div>
      ${albums.length < total ? '<div style="text-align:center;margin-top:20px"><button class="btn sec" id="more">Load more</button></div>' : ''}`;
    bindCards($('#alb'), albums, 'jf');
    $('#sort').onchange = (e) => { libSort = e.target.value; try { localStorage.tfSort = libSort; } catch {} renderLibrary(); };
    $('#scan').onclick = async () => { try { await api('/api/library/refresh', { method: 'POST' }); toast('Jellyfin library scan started'); } catch (e) { toast(e.message, true); } };
    const more = $('#more');
    if (more) more.onclick = async () => {
      more.disabled = true;
      const r = await api(`/api/library/albums?sort=${libSort}&start=${albums.length}`);
      albums = albums.concat(r.albums);
      $('#alb').innerHTML = draw(); bindCards($('#alb'), albums, 'jf');
      if (albums.length >= total) more.remove(); else more.disabled = false;
    };
  } catch (e) { main.innerHTML = errBox(e); }
}

async function renderAlbum() {
  loading();
  try {
    const a = await api(`/api/library/album/${view.id}`);
    const list = a.tracks.map((t) => ({ ...t, src: 'jf' }));
    main.innerHTML = `${backBtn()}
      <div class="hero"><div class="art" style="background-image:${a.hasImage ? jfImg(a.id, 500) : 'none'}"></div>
      <div><div class="meta">Album · In your library</div><h1>${esc(a.title)}</h1><div class="meta">${esc(a.artist)}${a.year ? ' · ' + a.year : ''} · ${list.length} tracks</div>
      <div class="acts"><button class="btn" id="pa">${I.play.replace('<svg', '<svg width="16"')} Play</button></div></div></div>
      <div id="tr">${trackRows(list, { showThumb: false, numbered: true })}</div>`;
    bindBack(); bindRows($('#tr'), list);
    $('#pa').onclick = () => list.length && playList(list, 0);
  } catch (e) { main.innerHTML = backBtn() + errBox(e); bindBack(); }
}

async function renderTidalAlbum() {
  loading();
  try {
    const a = await api(`/api/tidal/album/${view.id}`);
    const list = a.tracks.map((t) => ({ ...t, src: 'tidal', album: a.title, albumId: a.id, cover: a.cover }));
    main.innerHTML = `${backBtn()}
      <div class="hero"><div class="art" style="background-image:${bg(a.cover)}"></div>
      <div><div class="meta">Album · TIDAL</div><h1>${esc(a.title)}</h1><div class="meta">${esc(a.artist)}${a.year ? ' · ' + a.year : ''} · ${list.length} tracks</div>
      <div class="acts"><button class="btn" id="pa">${I.play.replace('<svg', '<svg width="16"')} Play</button>
      <button class="btn sec" id="da" data-dlalb="${esc(a.id)}">${I.dl.replace('<svg', '<svg width="16"')} Download album</button></div></div></div>
      <div id="tr">${trackRows(list, { showThumb: false, numbered: true })}</div>`;
    bindBack(); bindRows($('#tr'), list);
    $('#pa').onclick = () => list.length && playList(list, 0);
    $('#da').onclick = () => download('album', a.id, a.title, a.artist);
  } catch (e) { main.innerHTML = backBtn() + errBox(e); bindBack(); }
}

let lastQ = '';
async function renderSearch() {
  const q = $('#q').value.trim();
  if (!q) { main.innerHTML = '<div class="empty">Type in the search box to find music in your library and on Tidal.</div>'; return; }
  lastQ = q;
  main.innerHTML = `<h2>In your library</h2><div id="lib"><div class="empty">Searching…</div></div>
    <h2>On Tidal <span class="tag">click ↓ to download to the NAS</span></h2><div id="tid"><div class="empty">Searching…</div></div>`;
  api(`/api/library/search?q=${encodeURIComponent(q)}`).then((r) => {
    if (q !== lastQ || view.name !== 'search') return;
    const list = r.tracks.map((t) => ({ ...t, src: 'jf' }));
    const el = $('#lib');
    el.innerHTML = (r.albums.length ? albumCards(r.albums, 'jf') + '<div style="height:16px"></div>' : '') + (list.length ? trackRows(list) : (r.albums.length ? '' : '<div class="empty">Nothing in your library</div>'));
    bindCards(el, r.albums, 'jf'); bindRows(el, list);
  }).catch((e) => { if ($('#lib')) $('#lib').innerHTML = errBox(e); });
  api(`/api/tidal/search?q=${encodeURIComponent(q)}`).then((r) => {
    if (q !== lastQ || view.name !== 'search') return;
    const list = r.tracks.map((t) => ({ ...t, src: 'tidal' }));
    const el = $('#tid');
    el.innerHTML = trackRows(list) + (r.albums.length ? '<h2 style="font-size:13px">Tidal albums</h2>' + albumCards(r.albums, 'tidal') : '');
    bindRows(el, list); bindCards(el, r.albums, 'tidal');
  }).catch((e) => { if ($('#tid')) $('#tid').innerHTML = errBox(e); });
}

function renderDownloads() {
  const label = { queue_download: 'Queued', download: 'Downloading', queue_processing: 'Waiting', processing: 'Processing', finished: 'Done', error: 'Failed' };
  const items = queueCache;
  main.innerHTML = `<h2>Tidarr queue <span class="tag">${items.length}</span>
    <span style="margin-left:auto;display:flex;gap:6px"><button class="btn sec" id="rf">Retry failed</button><button class="btn sec" id="cf">Clear finished</button></span></h2>
    ${items.length ? items.map((i) => `<div class="qrow"><div style="min-width:0"><div class="rt" style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.title || (i.type + ' ' + i.id))}</div><div class="ra" style="color:var(--dim);font-size:13px">${esc(i.artist)} ${i.type ? '· ' + esc(i.type) : ''}</div></div>
      <span class="st ${esc(i.status)}">${label[i.status] || esc(i.status)}</span>
      <div class="bar"><i style="width:${i.status === 'finished' ? 100 : (typeof i.progress === 'number' ? Math.min(100, i.progress) : (i.status === 'download' || i.status === 'processing') ? 50 : 0)}%"></i></div></div>`).join('') : '<div class="empty">The queue is empty. Search Tidal and press ↓ on a song or album.</div>'}`;
  $('#rf').onclick = async () => { try { await api('/api/queue/retry', { method: 'POST' }); pollQueue(); } catch (e) { toast(e.message, true); } };
  $('#cf').onclick = async () => { try { await api('/api/queue/clear-finished', { method: 'POST' }); pollQueue(); } catch (e) { toast(e.message, true); } };
}

document.querySelectorAll('nav button').forEach((b) => b.onclick = () => { history_ = []; go(b.dataset.v, {}, false); if (b.dataset.v === 'downloads') pollQueue(); });
let qT;
$('#q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => { history_ = []; go('search', {}, false); }, 400); });
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(qT); history_ = []; go('search', {}, false); } });

api('/api/health').then((h) => {
  $('#h-jf').classList.toggle('up', h.jellyfin); $('#h-td').classList.toggle('up', h.tidarr); $('#h-ti').classList.toggle('up', h.tidal);
  const e = h.errors || {};
  $('#h-jf').title = e.jellyfin || 'OK'; $('#h-td').title = e.tidarr || 'OK'; $('#h-ti').title = e.tidal || 'OK';
  if (Object.keys(e).length) {
    const box = document.createElement('div');
    box.style.cssText = 'background:#2a1414;border:1px solid var(--err);border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px';
    box.innerHTML = '<b>Connection problems</b><br>' + Object.entries(e).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join('<br>') +
      `<br><span style="color:var(--dim)">Config: ${esc(JSON.stringify(h.config))}</span>`;
    main.prepend(box);
  }
}).catch(() => {});
go('library', {}, false);
pollQueue();
</script>
</body>
