<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Tidefin</title>
<style>
:root{--bg:#0b0d10;--panel:#15181d;--panel2:#1c2027;--line:#262b33;--text:#eef1f5;--dim:#9aa2b0;--accent:#3ee0c5;--on-accent:#04201b;--accent2:#1fb59c;--err:#ff6b6b;--ok:#5ad67d;--r:12px;--glow1:#1d5c55;--glow2:#2b2f5c;--glass:rgba(20,23,28,.55);--glass-strong:rgba(24,27,33,.78);--glass-line:rgba(255,255,255,.09);--glass-hi:rgba(255,255,255,.06);--blur:blur(28px) saturate(170%);transition:--accent 1s}
@property --accent{syntax:'<color>';inherits:true;initial-value:#3ee0c5}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;height:100%}
body{background:var(--bg);overflow:hidden;color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#glow{position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:
 radial-gradient(40% 45% at 22% 18%,var(--glow1) 0%,transparent 70%),
 radial-gradient(45% 50% at 82% 72%,var(--glow2) 0%,transparent 70%),
 radial-gradient(60% 60% at 50% 110%,color-mix(in srgb,var(--glow1) 50%,transparent) 0%,transparent 70%);
 filter:blur(40px) saturate(130%);opacity:.75;transition:background 1.2s}
#glow::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 0%,rgba(11,13,16,.55) 100%)}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line)}
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top));
 background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--glass-line);box-shadow:inset 0 -1px 0 rgba(0,0,0,.2)}
.logo{font-weight:700;font-size:18px;letter-spacing:.3px}.logo b{color:var(--accent)}
nav{display:flex;gap:4px}
nav button{padding:7px 14px;border-radius:999px;color:var(--dim);transition:background .2s,color .2s}nav button:hover{color:var(--text)}nav button.on{background:rgba(255,255,255,.12);color:var(--text);box-shadow:inset 0 1px 0 var(--glass-hi)}
.search{flex:1;max-width:460px;margin-left:auto}
.search input{width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--glass-line);background:rgba(255,255,255,.07);color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:var(--accent)}
.dots{display:flex;gap:10px;font-size:12px;color:var(--dim)}.dot::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--err);margin-right:5px}.dot.up::before{background:var(--ok)}
main{flex:1;overflow:auto;padding:84px 20px 130px;scroll-padding-top:84px}
h2{font-size:15px;margin:22px 0 12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:10px}
h2 .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);text-transform:none;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{cursor:pointer;min-width:0}.card .art{aspect-ratio:1;border-radius:var(--r);background:var(--panel2) center/cover;position:relative;overflow:hidden}
.card:hover .t{color:var(--accent)}
.card .t{margin-top:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .a{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:#000a;color:var(--accent)}
.rows{display:flex;flex-direction:column}
.row{cursor:pointer;-webkit-tap-highlight-color:transparent;display:grid;grid-template-columns:32px 44px minmax(0,1fr) auto 40px;align-items:center;gap:12px;padding:6px 10px;border-radius:10px;transition:background .15s}
.row:hover{background:rgba(255,255,255,.05)}.row:active{background:rgba(255,255,255,.1)}.row.playing{background:rgba(255,255,255,.09)}.row.playing .rt{color:var(--accent)}
.row .th{position:relative;display:grid;place-items:center;cursor:pointer}
.row .th .pb{width:30px;height:30px;border-radius:50%;background:#000a;color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s,transform .15s;transform:scale(.85)}
.row .th .pb svg{width:16px;height:16px}
.row:hover .th .pb,.row.playing .th .pb,.row .th.nothumb .pb{opacity:1;transform:none}
.row .th.nothumb{background:transparent}.row .th.nothumb .pb{background:var(--panel2);color:var(--text)}
.row.playing .th .pb{background:var(--accent);color:var(--on-accent)}
@media(hover:none){.row .th .pb{opacity:1;transform:none}}
.ib.dl{background:var(--panel2)}.ib.dl.done{background:#1b3324;color:var(--ok)}.ib.dl.queued{color:var(--accent)}
.card .art .pl{position:absolute;left:8px;bottom:8px;width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 4px 12px #0008;opacity:.92;transition:transform .15s,opacity .15s}
.card .art .pl svg{width:20px;height:20px}
.card .art .pl:hover{transform:scale(1.08);opacity:1}
.card .art .ck[hidden]{display:none}
.card .art .ck{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--ok);color:#0b2a14;display:grid;place-items:center;box-shadow:0 2px 8px #0007}
.card .art .ck svg{width:16px;height:16px}
.card .tt{display:flex;align-items:flex-start;gap:6px;margin-top:8px}
.card .tt>div{flex:1;min-width:0}.card .tt .t{margin-top:0}
.card .tt .ib{width:30px;height:30px;flex:none}.card .tt .ib svg{width:16px;height:16px}
.card .art{transition:transform .2s}.card:hover .art{outline:none;transform:translateY(-2px)}
.row .n{color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
.row .th{width:44px;height:44px;border-radius:6px;background:var(--panel2) center/cover}
.row .rt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .ra{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:var(--dim);font-variant-numeric:tabular-nums;font-size:13px}
.e{font-size:9px;padding:1px 4px;border-radius:3px;background:var(--dim);color:var(--bg);font-weight:700;margin-left:6px;vertical-align:2px}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}.ib:hover{background:var(--panel2);color:var(--text)}
.ib svg{width:18px;height:18px}
.dl.queued{color:var(--accent)}.dl.done{color:var(--ok)}.dl.err{color:var(--err)}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.hero{display:flex;gap:24px;align-items:flex-end;margin-bottom:20px}
.hero .art{width:200px;height:200px;border-radius:var(--r);background:var(--panel2) center/cover;flex:none}
.hero h1{margin:4px 0;font-size:30px}.hero .meta{color:var(--dim)}
.btn{padding:9px 18px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;display:inline-flex;gap:8px;align-items:center}
.btn.sec{background:rgba(255,255,255,.09);color:var(--text);box-shadow:inset 0 1px 0 var(--glass-hi)}.btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.back{color:var(--dim);margin-bottom:14px}.back:hover{color:var(--text)}
.empty{color:var(--dim);padding:30px 0;text-align:center}
.qrow{display:grid;grid-template-columns:1fr 140px 110px;gap:12px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
.st{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel2);justify-self:start}
.st.finished{color:var(--ok)}.st.error{color:var(--err)}.st.download,.st.processing{color:var(--accent)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
footer{position:fixed;left:10px;right:10px;bottom:10px;z-index:20;border-radius:18px;background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 var(--glass-hi);padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:20px;align-items:center}
.np{display:flex;gap:12px;align-items:center;min-width:0}.np .th{width:52px;height:52px;border-radius:6px;background:var(--panel2) center/cover;flex:none}
.np .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np .a{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(520px,44vw)}
.ctl .b{display:flex;gap:10px;align-items:center}
.play{width:42px;height:42px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center}.play svg{width:20px;height:20px}
.seek{display:flex;gap:10px;align-items:center;width:100%;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--accent)}
.right{display:flex;justify-content:flex-end;align-items:center;gap:8px}.right input{max-width:110px}
.src{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--panel2);color:var(--accent);margin-left:6px}
.toast{position:fixed;right:20px;bottom:110px;z-index:85;background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);padding:10px 16px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:360px}
.toast.show{opacity:1;transform:none}.toast.err{border-color:var(--err)}
/* ---------- album rows + download on cover ---------- */
.hrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,170px);gap:16px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity;scrollbar-width:thin}
.hrow .card{scroll-snap-align:start}
.cdlw{position:absolute;right:8px;bottom:8px}
.cdlw .ib{background:#000c;color:#fff;width:40px;height:40px;box-shadow:0 2px 8px #0008}
.cdlw .ib:hover{background:var(--accent);color:var(--on-accent)}
.cdlw .ib.queued{color:var(--accent)}.cdlw .ib.done{color:var(--ok)}.cdlw .ib.err{color:var(--err)}
.sub{font-size:13px;color:var(--dim);margin:18px 0 10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
@media(max-width:760px){.hrow{grid-auto-columns:minmax(128px,140px);gap:12px}}

/* ---------- ⋯ menu + confirm dialog ---------- */
.more{width:34px;height:34px}.more svg{width:18px;height:18px}
.menu{position:fixed;z-index:80;min-width:190px;background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);border-radius:10px;padding:6px;box-shadow:0 12px 32px #000a}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 12px;border-radius:7px;font-size:14px}
.menu button:hover{background:#ffffff12}.menu .danger{color:var(--err)}
.menu svg{width:16px;height:16px}
.modal-bg{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.modal{background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);border-radius:14px;padding:22px;max-width:400px;width:100%;box-shadow:0 20px 60px #000c}
.modal h3{margin:0 0 8px;font-size:18px}.modal p{margin:0 0 18px;color:var(--dim);line-height:1.5}
.modal .acts{justify-content:flex-end;margin:0}
.btn.danger{background:var(--err);color:#2a0707}

/* ---------- discography picker ---------- */
.modal.wide{max-width:560px;max-height:86vh;display:flex;flex-direction:column}
.dlist{overflow:auto;margin:0 -8px 16px;padding:0 8px;flex:1}
.ditem{display:grid;grid-template-columns:22px 48px minmax(0,1fr);gap:12px;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
.ditem:hover{background:#ffffff0d}
.ditem input{width:18px;height:18px;accent-color:var(--accent)}
.ditem .c{width:48px;height:48px;border-radius:6px;background:var(--panel2) center/cover}
.ditem .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem .a{font-size:13px;color:var(--dim)}
.ditem.own{opacity:.55;cursor:default}
.dtools{display:flex;gap:12px;font-size:13px;color:var(--dim);margin:-6px 0 10px}
.dtools button{color:var(--accent);font-size:13px}

/* ---------- lyrics ---------- */
#fs .fstabs{display:flex;gap:6px;margin-bottom:10px}
#fs-lyb{display:none}html.tv #fs-lyb{display:grid}
html.tv #fs-lyb.tvf{border-radius:50%}
#fs-lyb.on{background:var(--accent)!important;color:var(--on-accent)!important}
#fs .fstabs button{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:#ffffffaa;background:rgba(255,255,255,.06)}
#fs .fstabs button.on{background:rgba(255,255,255,.9);color:#111}
#fs-ly{max-height:52vh;overflow:auto;scroll-behavior:smooth;padding:4px 2px 30vh;mask-image:linear-gradient(transparent 0,#000 8%,#000 80%,transparent 100%)}
#fs-ly .ln{font-size:22px;font-weight:700;line-height:1.35;margin:0 0 14px;color:#ffffff55;cursor:pointer;transition:color .3s,transform .3s;transform-origin:left}
#fs-ly .ln.on{color:#fff;transform:scale(1.03)}
#fs-ly .ln.past{color:#ffffff88}
#fs-ly.plain .ln{color:#ffffffdd;font-size:18px;font-weight:600;cursor:default}
#fs-ly .none{font-size:15px}
@media(min-width:900px) and (min-aspect-ratio:4/3){#fs-ly{max-height:64vh}}
html.phone #fs-ly .ln{font-size:20px}
html.fold #fs-ly{max-height:none}html.fold #fs-ly .ln{font-size:17px}

/* ---------- YouTube Music ---------- */
.tag.yt{background:#3a1212;color:#ff9a9a}
.qpill{font-size:11px;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.08);color:var(--dim);margin-right:6px}
.ytnote{font-size:13px;color:var(--dim);margin:10px 10px 0}
.ytmodal{max-width:900px!important;padding:14px!important}
.ytframe{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.ytframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytmeta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
html.phone .ytrow .d .qpill{display:none}

.srctabs{display:flex;gap:6px;background:rgba(255,255,255,.06);border-radius:999px;padding:4px;width:max-content;margin:22px 0 10px}
.srctabs button{display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;font-weight:600;color:var(--dim)}
.srctabs button b{font-size:11px;font-weight:700;background:rgba(255,255,255,.12);border-radius:999px;padding:2px 8px}
.srctabs button.on{background:var(--text);color:var(--bg)}.srctabs button.on b{background:rgba(0,0,0,.15)}
.srctabs button[data-src=yt].on{background:#ff6b6b;color:#2a0707}
.badge.ytb{color:#ff9a9a}
.card .art .pl.ytpl{background:#ff6b6b;color:#2a0707}
.ontidal{font-size:11px;font-weight:600;color:#5ad6b8;margin-left:8px}.ontidal.own{color:var(--ok)}
.linkbtn{color:#ff9a9a;font-size:13px;text-decoration:underline}
.ychk{cursor:pointer}.ychk input{width:18px;height:18px;accent-color:#ff6b6b}
html.tv .srctabs button{font-size:22px;padding:14px 28px}

/* ---------- settings page ---------- */
nav .railonly{display:none}html.tv nav .railonly,html.fold nav .railonly{display:flex}
html.tv nav button.railonly{order:9}
.pagehead{display:flex;align-items:center;justify-content:space-between}.pagehead .pagetitle{margin-bottom:14px}
.set{max-width:760px}
.set .sh{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:24px 6px 8px}
.set .grp{background:rgba(255,255,255,.05);border:1px solid var(--glass-line);border-radius:16px;overflow:hidden}
.set .it{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.set .it:last-child{border-bottom:0}
.set .it.col{flex-direction:column;align-items:stretch}
.set .it small{display:block;color:var(--dim);font-size:12.5px;margin-top:3px}
.set .v{color:var(--dim);font-size:13px;white-space:nowrap}
.tg{width:48px;height:28px;border-radius:999px;background:#2a2f38;position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#9aa2b0;transition:left .2s,background .2s}
.tg.on{background:var(--accent)}.tg.on::after{left:23px;background:#fff}
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:10px;padding:3px;flex:none;flex-wrap:wrap}
.seg button{font-size:13px;padding:7px 12px;border-radius:8px;color:var(--dim)}
.seg button.on{background:rgba(255,255,255,.14);color:var(--text);font-weight:600}
.sw{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.sw button{width:28px;height:28px;border-radius:50%}
.sw button.on{outline:3px solid #fff;outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.07);color:var(--dim);border:1px solid transparent}
.chip.on{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--text);border-color:var(--accent)}
.shelves{display:flex;flex-direction:column;gap:6px}
.shelf-it{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:rgba(0,0,0,.2)}
.shelf-it .mv{width:34px;height:34px;font-size:16px}.shelf-it .mv:disabled{opacity:.25}
html.phone .set .it:not(.col){flex-wrap:wrap}
html.tv .set{max-width:1100px}html.tv .set .it{padding:20px 24px;font-size:22px}html.tv .seg button{font-size:19px;padding:10px 18px}
html.tv .tg{width:64px;height:36px}html.tv .tg::after{width:30px;height:30px}html.tv .tg.on::after{left:31px}
html.tv .chip{font-size:19px;padding:12px 20px}html.tv .sw button{width:40px;height:40px}
/* glass strength */
html.glass-off{--glass:rgba(20,23,28,.97);--glass-strong:rgba(24,27,33,.99);--blur:none}
html.glass-off #glow{opacity:0}
html.glass-subtle{--glass:rgba(20,23,28,.8);--glass-strong:rgba(24,27,33,.9);--blur:blur(14px) saturate(130%)}
html.glass-subtle #glow{opacity:.4}

/* ---------- nav icons (desktop: text pills) ---------- */
nav button svg{display:none;width:22px;height:22px}
nav button{display:flex;align-items:center;gap:6px}
.mini-prog{display:none}
.pagetitle{font-size:30px;font-weight:800;margin:4px 0 14px;letter-spacing:-.5px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-bottom:8px}
.qt{display:flex;align-items:center;gap:10px;height:56px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.07);cursor:pointer;font-weight:600;font-size:14px;transition:background .15s}
.qt:hover{background:rgba(255,255,255,.13)}
.qt i{width:56px;height:56px;flex:none;background:var(--panel2) center/cover}
.qt span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding-right:8px}
.shelfh{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.shelfh h3{margin:0;font-size:19px;font-weight:700}
.shelfh button{color:var(--dim);font-size:13px}
.arow{display:grid;grid-auto-flow:column;grid-auto-columns:120px;gap:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.arow::-webkit-scrollbar{display:none}

/* ---------- phone (cover screen / narrow) ---------- */
html.phone header{padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));gap:10px}
html.phone .dots{display:none}
html.phone header .search{display:none;order:3;flex-basis:100%;max-width:none}
html.phone[data-view=search] header .search{display:block}
html.phone[data-view=search] main{padding-top:calc(118px + env(safe-area-inset-top))!important}
html.phone main{padding:calc(62px + env(safe-area-inset-top)) 14px calc(150px + env(safe-area-inset-bottom))!important}

async function api(path, opts) {

// ---------- settings (saved on the NAS, same on every device) ----------
let S = { youtube: false, accent: 'cover', glass: 'strong', textSize: 'normal', startPage: 'home', libraryTab: 'artists',
  homeShelves: ['recent', 'added', 'new', 'artists'], ownedPct: 80, releaseTypes: ['studio'], confirmBig: true, lookbackMonths: 12 };

}

// ---------- what's already in the library ----------
const nkey = (artist, title) => normT(String(artist || '').split(/,|&| feat\.? | ft\.? /i)[0]) + '|' + normT(title);

let libAlbums = new Map(), libTracks = new Set(), libTrackMap = new Map(); // libAlbums: key -> songs you have

// Owned = you have (nearly) every song. A single downloaded song doesn't count as the album.
const albumInLib = (a) => {

async function download(type, id, title, artist, skipConfirm) {

// ---------- TV: d-pad spatial navigation + remote keys ----------
function initTv() {
  const FOCUSABLE = 'nav button, header input, main button, main .card, main .acard, main .qt, main .gtile, main .row, main select, main .back, footer button, footer .np, .modal button, .modal input, .menu button, #fs button, #fs .qi, #fs .falb';
  const visible = (el) => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && r.bottom > -200 && r.top < innerHeight + 2000 && getComputedStyle(el).visibility !== 'hidden'; };
  const scope = () => document.querySelector('.modal-bg') || document.querySelector('.menu') || (fs.classList.contains('open') ? fs : document);
  const items = () => [...scope().querySelectorAll(FOCUSABLE)].filter((el) => !el.disabled && !el.closest('[hidden]') && visible(el) && !(scope() === document && el.closest('#fs')));
  let cur = null;
  const setF = (el) => {
    if (!el) return;
    if (cur) cur.classList.remove('tvf');
    cur = el; el.classList.add('tvf');
    if (!el.hasAttribute('tabindex') && !/^(BUTTON|INPUT|SELECT)$/.test(el.tagName)) el.setAttribute('tabindex', '-1');
    el.focus({ preventScroll: true });
    el.scrollIntoView({ block: el.closest('nav,footer') ? 'nearest' : 'center', inline: 'nearest', behavior: 'smooth' });
  };
  const centre = (r) => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
  function move(dir) {
    const list = items();
    if (!cur || !document.contains(cur) || !list.includes(cur)) { setF(list.find((e) => e.closest('main')) || list[0]); return; }
    const a = cur.getBoundingClientRect(), c = centre(a);
    let best = null, bestScore = Infinity;
    for (const el of list) {
      if (el === cur) continue;
      const b = el.getBoundingClientRect(), d = centre(b);
      const dx = d.x - c.x, dy = d.y - c.y;
      let main, cross;
      if (dir === 'left') { if (b.right > a.left + 4) continue; main = -dx; cross = Math.abs(dy); }
      if (dir === 'right') { if (b.left < a.right - 4) continue; main = dx; cross = Math.abs(dy); }
      if (dir === 'up') { if (b.bottom > a.top + 4) continue; main = -dy; cross = Math.abs(dx); }
      if (dir === 'down') { if (b.top < a.bottom - 4) continue; main = dy; cross = Math.abs(dx); }
      // stay in the same area (side menu / page / player bar) unless moving sideways into it
      const region = (x) => x.closest('nav') ? 'nav' : x.closest('footer') ? 'footer' : 'main';
      const jump = region(el) !== region(cur) && (dir === 'up' || dir === 'down') ? 2000 : 0;
      const score = main + cross * 2.2 + jump;
      if (score < bestScore) { bestScore = score; best = el; }
    }
    if (best) setF(best);
  }
  // keep focus ring when the pointer (Magic Remote) hovers something
  document.addEventListener('mouseover', (e) => { const el = e.target.closest(FOCUSABLE); if (el && items().includes(el)) { if (cur) cur.classList.remove('tvf'); cur = el; el.classList.add('tvf'); } });
  document.addEventListener('keydown', (e) => {
    const k = e.key, code = e.keyCode;
    const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
    const dirs = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
    if (dirs[k]) {
      if (typing && (k === 'ArrowLeft' || k === 'ArrowRight')) return; // move the text cursor
      e.preventDefault(); move(dirs[k]); return;
    }
    if (k === 'Enter' && cur && !typing && !/^(BUTTON|INPUT|SELECT)$/.test(cur.tagName)) { e.preventDefault(); cur.click(); return; }
    if (code === 461 || k === 'GoBack' || k === 'BrowserBack') { // LG remote Back
      e.preventDefault();
      if (fs.classList.contains('open') || document.querySelector('.modal-bg, .menu') || history_.length) history.back();
      else if (view.name !== 'home') go('home', {}, false);
      else { const sys = window.webOSSystem || window.PalmSystem; if (sys && sys.platformBack) sys.platformBack(); } // leave the TV app
      return;
    }
    // media keys on the remote
    if (code === 415 || k === 'MediaPlay') { e.preventDefault(); if (audio.paused) $('#pp').onclick(); return; }
    if (code === 19 || k === 'MediaPause') { e.preventDefault(); if (!audio.paused) $('#pp').onclick(); return; }
    if (k === 'MediaPlayPause' || code === 179) { e.preventDefault(); $('#pp').onclick(); return; }
    if (code === 417 || code === 176 || k === 'MediaTrackNext' || k === 'MediaFastForward' || code === 33) { e.preventDefault(); nextTrack(false); return; }
    if (code === 412 || code === 177 || k === 'MediaTrackPrevious' || k === 'MediaRewind' || code === 34) { e.preventDefault(); $('#prev').onclick(); return; }
    if (code === 413 || k === 'MediaStop') { e.preventDefault(); audio.pause(); return; }
  }, true);
  // re-focus something sensible after each page change / dialog
  const refocus = () => setTimeout(() => { if (!cur || !document.contains(cur) || !items().includes(cur)) { const l = items(); setF(l.find((e) => e.closest('#fs .fctl .big')) || l.find((e) => e.closest('main') && e.id === 'pa') || l.find((e) => e.closest('main') && !e.closest('.ltabs') && !e.classList.contains('back')) || l[0]); } }, 350);
  new MutationObserver(refocus).observe(main, { childList: true });
  new MutationObserver(refocus).observe(document.body, { childList: true });
  new MutationObserver(refocus).observe(fs, { attributes: true, attributeFilter: ['class'] });
  // the big player opens on its own when a song starts on the TV
  const _load = loadCurrent;
  loadCurrent = function () { _load.apply(this, arguments); if (!fs.classList.contains('open')) openFs(); applyTvLyrics(); };
  let tvLy = false; try { tvLy = localStorage.tfTvLyrics === '1'; } catch {}
  function applyTvLyrics() { setFsTab(tvLy ? 'ly' : 'q'); fs.classList.toggle('ly-on', tvLy); $('#fs-lyb').classList.toggle('on', tvLy); }
  $('#fs-lyb').onclick = (e) => { e.stopPropagation(); tvLy = !tvLy; try { localStorage.tfTvLyrics = tvLy ? '1' : '0'; } catch {} applyTvLyrics(); };
  applyTvLyrics();
  refocus();
}

// ---------- fan-uploaded albums: fix names with MusicBrainz before downloading ----------
const isFanAlbum = (id) => /^VL/.test(id || '');
function mainArtist(tracks, fallback) {
  const c = new Map(); for (const t of tracks) { const a = (t.artist || '').split(',')[0].trim(); if (a) c.set(a, (c.get(a) || 0) + 1); }
  return [...c].sort((a, b) => b[1] - a[1])[0]?.[0] || fallback || 'Unknown artist';
}
async function fanAlbumQueue(al, picked) {
  if (!picked.length) return;
  const artist = mainArtist(al.tracks, al.artist);
  toast('Looking up the right song names…');
  let m;
  try { m = await api('/api/yt/match', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ artist, album: al.title, titles: picked.map((t) => t.title) }) }); }
  catch { m = { album: al.title, confident: false, candidates: [], cleaned: picked.map((t) => t.title) }; }
  const build = (cand, names, albumName, artistName) => picked.map((t, i) => ({
    ...t, title: names[i], artist: artistName, albumArtist: artistName, album: albumName,
    number: cand ? (cand.map[i]?.n || null) : (t.number || i + 1), total: cand ? cand.total : picked.length,
    year: cand ? cand.year : al.year, cover: cand ? cand.cover : (al.cover || t.cover), coverFallback: al.cover || t.cover,
  }));
  if (m.confident) {
    const c = m.candidates[0];
    toast(`Matched "${c.title}" (${c.year || '?'}) on MusicBrainz`);
    return ytQueue(build(c, picked.map((t, i) => c.map[i]?.title || m.cleaned[i]), c.title, artist));
  }
  const items = await fanReview(m, picked, artist, build);
  if (items) await ytQueue(items);
}
function fanReview(m, picked, artist, build) {
  return new Promise((resolve) => {
    const bgEl = document.createElement('div'); bgEl.className = 'modal-bg';
    const opts = m.candidates.map((c, i) => `<option value="${i}">${esc(c.title)} · ${esc(c.artist)}${c.year ? ' · ' + c.year : ''} · ${c.total} songs (${Math.round(c.trackScore * 100)}% match)</option>`).join('');
    bgEl.innerHTML = `<div class="modal fanrev" role="dialog" aria-modal="true"><h3>Check song names</h3>
      <p>${m.candidates.length ? 'Not a sure match on MusicBrainz. Pick the right release, or fix the names yourself.' : 'No match found on MusicBrainz' + (m.error ? ' (' + esc(m.error) + ')' : '') + '. The names below are cleaned up from YouTube; fix anything that\'s wrong.'}</p>
      <label class="frl">Release<select id="fr-rel">${opts}<option value="-1">No match, use cleaned YouTube names</option></select></label>
      <div class="frg"><label class="frl">Artist<input id="fr-art"></label><label class="frl">Album<input id="fr-alb"></label></div>
      <div class="frrows">${picked.map((t, i) => `<div class="frrow"><span class="frn" data-frn="${i}"></span><div><input data-frt="${i}"><div class="fryt">YouTube: ${esc(t.title)}</div></div></div>`).join('')}</div>
      <div class="acts"><button class="btn sec" data-c="0">Cancel</button><button class="btn" data-c="1">Download ${picked.length} song${picked.length === 1 ? '' : 's'}</button></div></div>`;
    const sel = bgEl.querySelector('#fr-rel'), cand = () => m.candidates[+sel.value] || null;
    const fill = () => {
      const c = cand();
      bgEl.querySelector('#fr-art').value = artist;
      bgEl.querySelector('#fr-alb').value = c ? c.title : m.album;
      picked.forEach((t, i) => {
        const mm = c && c.map[i];
        bgEl.querySelector(`[data-frt="${i}"]`).value = mm ? mm.title : m.cleaned[i];
        bgEl.querySelector(`[data-frn="${i}"]`).textContent = c ? (mm ? mm.n : '?') : (t.number || i + 1);
      });
    };
    sel.value = m.candidates.length ? '0' : '-1'; sel.onchange = fill; fill();
    const done = (v) => { bgEl.remove(); resolve(v); };
    bgEl.onclick = (e) => { if (e.target === bgEl) done(null); };
    bgEl.querySelector('[data-c="0"]').onclick = () => done(null);
    bgEl.querySelector('[data-c="1"]').onclick = () => {
      const names = picked.map((_, i) => bgEl.querySelector(`[data-frt="${i}"]`).value.trim() || picked[i].title);
      const art = bgEl.querySelector('#fr-art').value.trim() || artist, alb = bgEl.querySelector('#fr-alb').value.trim() || m.album;
      done(build(cand(), names, alb, art));
    };
    document.body.appendChild(bgEl);
  });
}
async function ytQueue(items, single) {

    toast(items.length === 1 ? `Downloading from YouTube Music: ${items[0].title}` : `Downloading ${items.length} songs from YouTube Music`);

    const upd = () => { const n = boxes.filter((b) => b.checked && !b.disabled).length; const b = $('#ya-sel'); b.textContent = n ? `Download ${n} song${n === 1 ? '' : 's'}` : 'Nothing selected'; b.disabled = !n; };
    boxes.forEach((b) => b.onchange = upd); upd();
    main.querySelectorAll('[data-ytplay]').forEach((b) => b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); ytPlayer(list[+b.dataset.ytplay], a.playlistId); });
    $('#ya-play').onclick = () => list.length && ytPlayer(list[0], a.playlistId);
    const fan = isFanAlbum(view.id), q = (l) => fan ? fanAlbumQueue({ ...a, cover }, l) : ytQueue(l);
    $('#ya-sel').onclick = async () => { try { await q(boxes.filter((b) => b.checked && !b.disabled).map((b) => list[+b.dataset.yck])); } catch (e) { toast(e.message, true); } };
    $('#ya-all').onclick = async () => { try { await q(list); } catch (e) { toast(e.message, true); } };
  } catch (e) { main.innerHTML = backBtn() + errBox(e); bindBack(); }
}
const ytBtnClass = (id) => 'ib dl ' + ({ queued: 'queued', done: 'done', error: 'err' }[ytState.get(id)] || '');
const ytBtnIcon = (id) => ({ queued: I.wait, done: I.ok, error: I.err }[ytState.get(id)] || I.dl);
let ytTimer = null, ytJobsCache = {};
async function pollYt() {
  clearTimeout(ytTimer);
  if (!S.youtube) return;
  try {
    const { jobs } = await api('/api/yt/status');
    ytJobsCache = jobs;
    let busy = false, done = false;
    for (const [id, j] of Object.entries(jobs)) {
      if (ytState.get(id) === 'queued' && j.state === 'done') done = true;
      if (j.state === 'error' && ytState.get(id) === 'queued') toast('YouTube download failed: ' + (j.error || 'unknown error'), true);
      ytState.set(id, j.state === 'error' ? 'error' : j.state); if (j.state === 'queued') busy = true;
    }
    refreshYtButtons(); updateDlBadge(queueCache);
    if (view.name === 'downloads') renderDownloads();
    if (done) setTimeout(() => loadLibIndex(true), 8000);
    if (busy) ytTimer = setTimeout(pollYt, 5000);
  } catch { ytTimer = setTimeout(pollYt, 15000); }
}
// Official YouTube player (YouTube's rules: the player must be visible while it plays)
function ytPlayer(t, list) {
  if (!audio.paused) audio.pause();
  const bgEl = document.createElement('div'); bgEl.className = 'modal-bg';
  bgEl.innerHTML = `<div class="modal ytmodal" role="dialog" aria-modal="true">
    <div class="ytframe"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(t.id)}?autoplay=1&rel=0&modestbranding=1${list ? '&list=' + encodeURIComponent(list) : ''}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="${esc(t.title)}"></iframe></div>
    <div class="ytmeta"><div style="min-width:0"><div class="rt">${esc(t.title)}</div><div class="ra" style="color:var(--dim)">${esc(t.artist)} · YouTube Music</div></div>
    <button class="btn sec" data-c="0">Close</button></div></div>`;
  const close = () => { bgEl.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  bgEl.onclick = (e) => { if (e.target === bgEl) close(); };
  bgEl.querySelector('[data-c="0"]').onclick = close;
  document.addEventListener('keydown', onKey);
  document.body.appendChild(bgEl);
}

function renderDownloads() {
  const label = { queue_download: 'Queued', download: 'Downloading', queue_processing: 'Waiting', processing: 'Processing', finished: 'Done', error: 'Failed' };
  const items = queueCache;
  main.innerHTML = `<h2>Tidal <span class="tag">${items.length}</span>
    <span style="margin-left:auto;display:flex;gap:6px"><button class="btn sec" id="rf">Retry failed</button><button class="btn sec" id="cf">Clear finished</button></span></h2>
    ${items.length ? items.map((i) => `<div class="qrow"><div style="min-width:0"><div class="rt" style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.title || (i.type + ' ' + i.id))}</div><div class="ra" style="color:var(--dim);font-size:13px">${esc(i.artist)} ${i.type ? '· ' + esc(i.type) : ''}</div></div>
      <span class="st ${esc(i.status)}">${label[i.status] || esc(i.status)}${i.progress && i.progress.total > 1 && i.status !== 'finished' ? ` · ${i.progress.current}/${i.progress.total}` : ''}</span>
      <div class="bar"><i style="width:${i.status === 'finished' ? 100 : (i.progress && i.progress.total ? Math.round(100 * i.progress.current / i.progress.total) : typeof i.progress === 'number' ? Math.min(100, i.progress) : (i.status === 'download' || i.status === 'processing') ? 50 : 0)}%"></i></div></div>`).join('') : '<div class="empty">The queue is empty. Search Tidal and press ↓ on a song or album.</div>'}`;
  $('#rf').onclick = async () => { try { await api('/api/queue/retry', { method: 'POST' }); pollQueue(); } catch (e) { toast(e.message, true); } };
  $('#cf').onclick = async () => { try { await api('/api/queue/clear-finished', { method: 'POST' }); pollQueue(); } catch (e) { toast(e.message, true); } };
  renderYtDownloads();
}
function renderYtDownloads() {
  if (!S.youtube) return;
  const jobs = Object.entries(ytJobsCache).sort((a, b) => (b[1].at || 0) - (a[1].at || 0)).slice(0, 100);
  const label = { queued: 'Downloading', done: 'Done', error: 'Failed' };
  const wrap = document.createElement('div');
  wrap.innerHTML = `<h2 style="margin-top:28px">YouTube Music <span class="tag">${jobs.length}</span>
    ${jobs.some(([, j]) => j.state !== 'queued') ? '<span style="margin-left:auto"><button class="btn sec" id="ycf">Clear finished</button></span>' : ''}</h2>` +
    (jobs.length ? jobs.map(([, j]) => `<div class="qrow"><div style="min-width:0"><div class="rt" style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(j.title)}</div><div class="ra" style="color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(j.artist)}${j.album ? ' · ' + esc(j.album) : ''}</div></div>
      <span class="st ${j.state === 'done' ? 'finished' : j.state === 'error' ? 'error' : 'download'}" ${j.error ? `title="${esc(j.error)}"` : ''}>${label[j.state] || esc(j.state)}</span>
      <div class="bar"><i style="width:${j.state === 'done' ? 100 : j.state === 'error' ? 0 : 50}%"></i></div></div>`).join('')
    : '<div class="empty">No YouTube Music downloads yet.</div>');
  main.appendChild(wrap);
  const c = $('#ycf'); if (c) c.onclick = async () => { try { await api('/api/yt/clear', { method: 'POST' }); pollYt(); } catch (e) { toast(e.message, true); } };
}

document.querySelectorAll('nav button').forEach((b) => b.onclick = () => { history_ = []; go(b.dataset.v, {}, false); if (b.dataset.v === 'downloads') { pollQueue(); pollYt(); } });
let qT;
$('#q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => { history_ = []; go('search', {}, false); }, 400); });
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(qT); history_ = []; go('search', {}, false); } });

api('/api/health').then((h) => {
  $('#h-jf').classList.toggle('up', h.jellyfin); $('#h-td').classList.toggle('up', h.tidarr); $('#h-ti').classList.toggle('up', h.tidal);
  const e = h.errors || {};
  $('#h-jf').title = e.jellyfin || 'OK'; $('#h-td').title = e.tidarr || 'OK'; $('#h-ti').title = e.tidal || 'OK';
  if (Object.keys(e).length) {
    const box = document.createElement('div');
    box.style.cssText = 'background:#2a1414;border:1px solid var(--err);border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px';
    box.innerHTML = '<b>Connection problems</b><br>' + Object.entries(e).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join('<br>') +
      `<br><span style="color:var(--dim)">Config: ${esc(JSON.stringify(h.config))}</span>`;
    main.prepend(box);
  }
}).catch(() => {});
loadLibIndex();
if (NATIVE) {
  document.documentElement.classList.add('in-app');
  const g = $('#appset'); g.hidden = false; g.onclick = () => NATIVE.openSettings();
}
window.__tfReady = true; setLayout();
if (IS_TV) initTv();
loadSettings().then(() => { libTab = S.libraryTab || 'artists'; if (S.youtube) pollYt(); go(S.startPage || 'home', {}, false); });
applySettings();
pollQueue();
</script>
