<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Tidefin</title>
<style>
:root{--bg:#0d0f12;--panel:#15181d;--panel2:#1c2027;--line:#262b33;--text:#e9ecf1;--dim:#8b93a1;--accent:#3ee0c5;--accent2:#1fb59c;--err:#ff6b6b;--ok:#5ad67d;--r:10px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-weight:700;font-size:18px;letter-spacing:.3px}.logo b{color:var(--accent)}
nav{display:flex;gap:4px}
nav button{padding:7px 14px;border-radius:999px;color:var(--dim)}nav button.on{background:var(--panel2);color:var(--text)}
.search{flex:1;max-width:460px;margin-left:auto}
.search input{width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:var(--accent)}
.dots{display:flex;gap:10px;font-size:12px;color:var(--dim)}.dot::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--err);margin-right:5px}.dot.up::before{background:var(--ok)}
main{flex:1;overflow:auto;padding:20px 20px 120px}
h2{font-size:15px;margin:22px 0 12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:10px}
h2 .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);text-transform:none;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{cursor:pointer;min-width:0}.card .art{aspect-ratio:1;border-radius:var(--r);background:var(--panel2) center/cover;position:relative;overflow:hidden}
.card:hover .t{color:var(--accent)}
.card .t{margin-top:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .a{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:#000a;color:var(--accent)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:32px 44px minmax(0,1fr) auto 40px;align-items:center;gap:12px;padding:6px 10px;border-radius:10px;transition:background .15s}
.row:hover{background:var(--panel)}.row.playing{background:var(--panel2)}.row.playing .rt{color:var(--accent)}
.row .th{position:relative;display:grid;place-items:center;cursor:pointer}
.row .th .pb{width:30px;height:30px;border-radius:50%;background:#000a;color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s,transform .15s;transform:scale(.85)}
.row .th .pb svg{width:16px;height:16px}
.row:hover .th .pb,.row.playing .th .pb,.row .th.nothumb .pb{opacity:1;transform:none}
.row .th.nothumb{background:transparent}.row .th.nothumb .pb{background:var(--panel2);color:var(--text)}
.row.playing .th .pb{background:var(--accent);color:#04201b}
@media(hover:none){.row .th .pb{opacity:1;transform:none}}
.ib.dl{background:var(--panel2)}.ib.dl.done{background:#1b3324;color:var(--ok)}.ib.dl.queued{color:var(--accent)}
.card .art .pl{position:absolute;left:8px;bottom:8px;width:42px;height:42px;border-radius:50%;background:var(--accent);color:#04201b;display:grid;place-items:center;box-shadow:0 4px 12px #0008;opacity:.92;transition:transform .15s,opacity .15s}
.card .art .pl svg{width:20px;height:20px}
.card .art .pl:hover{transform:scale(1.08);opacity:1}
.card .art .ck[hidden]{display:none}
.card .art .ck{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--ok);color:#0b2a14;display:grid;place-items:center;box-shadow:0 2px 8px #0007}
.card .art .ck svg{width:16px;height:16px}
.card .tt{display:flex;align-items:flex-start;gap:6px;margin-top:8px}
.card .tt>div{flex:1;min-width:0}.card .tt .t{margin-top:0}
.card .tt .ib{width:30px;height:30px;flex:none}.card .tt .ib svg{width:16px;height:16px}
.card .art{transition:transform .2s}.card:hover .art{outline:none;transform:translateY(-2px)}
.row .n{color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
.row .th{width:44px;height:44px;border-radius:6px;background:var(--panel2) center/cover}
.row .rt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .ra{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:var(--dim);font-variant-numeric:tabular-nums;font-size:13px}
.e{font-size:9px;padding:1px 4px;border-radius:3px;background:var(--dim);color:var(--bg);font-weight:700;margin-left:6px;vertical-align:2px}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}.ib:hover{background:var(--panel2);color:var(--text)}
.ib svg{width:18px;height:18px}
.dl.queued{color:var(--accent)}.dl.done{color:var(--ok)}.dl.err{color:var(--err)}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.hero{display:flex;gap:24px;align-items:flex-end;margin-bottom:20px}
.hero .art{width:200px;height:200px;border-radius:var(--r);background:var(--panel2) center/cover;flex:none}
.hero h1{margin:4px 0;font-size:30px}.hero .meta{color:var(--dim)}
.btn{padding:9px 18px;border-radius:999px;background:var(--accent);color:#04201b;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.btn.sec{background:var(--panel2);color:var(--text)}.btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.back{color:var(--dim);margin-bottom:14px}.back:hover{color:var(--text)}
.empty{color:var(--dim);padding:30px 0;text-align:center}
.qrow{display:grid;grid-template-columns:1fr 140px 110px;gap:12px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
.st{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel2);justify-self:start}
.st.finished{color:var(--ok)}.st.error{color:var(--err)}.st.download,.st.processing{color:var(--accent)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:20px;align-items:center}
.np{display:flex;gap:12px;align-items:center;min-width:0}.np .th{width:52px;height:52px;border-radius:6px;background:var(--panel2) center/cover;flex:none}
.np .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np .a{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(520px,44vw)}
.ctl .b{display:flex;gap:10px;align-items:center}
.play{width:42px;height:42px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center}.play svg{width:20px;height:20px}
.seek{display:flex;gap:10px;align-items:center;width:100%;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--accent)}
.right{display:flex;justify-content:flex-end;align-items:center;gap:8px}.right input{max-width:110px}
.src{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--panel2);color:var(--accent);margin-left:6px}
.toast{position:fixed;right:20px;bottom:100px;background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:360px}
.toast.show{opacity:1;transform:none}.toast.err{border-color:var(--err)}
/* ---------- album rows + download on cover ---------- */
.hrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,170px);gap:16px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity;scrollbar-width:thin}
.hrow .card{scroll-snap-align:start}
.cdlw{position:absolute;right:8px;bottom:8px}
.cdlw .ib{background:#000c;color:#fff;width:40px;height:40px;box-shadow:0 2px 8px #0008}
.cdlw .ib:hover{background:var(--accent);color:#04201b}
.cdlw .ib.queued{color:var(--accent)}.cdlw .ib.done{color:var(--ok)}.cdlw .ib.err{color:var(--err)}
.sub{font-size:13px;color:var(--dim);margin:18px 0 10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
@media(max-width:760px){.hrow{grid-auto-columns:minmax(128px,140px);gap:12px}}

/* ---------- ⋯ menu + confirm dialog ---------- */
.more{width:34px;height:34px}.more svg{width:18px;height:18px}
.menu{position:fixed;z-index:80;min-width:190px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 12px 32px #000a}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 12px;border-radius:7px;font-size:14px}
.menu button:hover{background:#ffffff12}.menu .danger{color:var(--err)}
.menu svg{width:16px;height:16px}
.modal-bg{position:fixed;inset:0;z-index:90;background:#000a;display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:400px;width:100%;box-shadow:0 20px 60px #000c}
.modal h3{margin:0 0 8px;font-size:18px}.modal p{margin:0 0 18px;color:var(--dim);line-height:1.5}
.modal .acts{justify-content:flex-end;margin:0}
.btn.danger{background:var(--err);color:#2a0707}

/* ---------- discography picker ---------- */
.modal.wide{max-width:560px;max-height:86vh;display:flex;flex-direction:column}
.dlist{overflow:auto;margin:0 -8px 16px;padding:0 8px;flex:1}
.ditem{display:grid;grid-template-columns:22px 48px minmax(0,1fr);gap:12px;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
.ditem:hover{background:#ffffff0d}
.ditem input{width:18px;height:18px;accent-color:var(--accent)}
.ditem .c{width:48px;height:48px;border-radius:6px;background:var(--panel2) center/cover}
.ditem .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem .a{font-size:13px;color:var(--dim)}
.ditem.own{opacity:.55;cursor:default}
.dtools{display:flex;gap:12px;font-size:13px;color:var(--dim);margin:-6px 0 10px}
.dtools button{color:var(--accent);font-size:13px}

/* ---------- library sections ---------- */
.ltabs{display:flex;gap:8px;margin:4px 0 6px;flex-wrap:wrap;align-items:center}
.ltabs button{padding:8px 16px;border-radius:999px;background:var(--panel2);color:var(--dim);font-weight:600}
.ltabs button.on{background:var(--text);color:var(--bg)}
.ltabs .sp{margin-left:auto;display:flex;gap:6px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.acard{cursor:pointer;text-align:center;min-width:0}
.acard .pic{aspect-ratio:1;border-radius:50%;background:var(--panel2) center/cover;display:grid;place-items:center;font-size:42px;font-weight:700;color:var(--dim);transition:transform .15s}
.acard:hover .pic{transform:scale(1.03);outline:2px solid var(--accent)}
.acard .n{margin-top:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .s{font-size:12px;color:var(--dim)}
.ahero{display:flex;gap:28px;align-items:center;margin:6px 0 10px}
.ahero .pic{width:190px;height:190px;border-radius:50%;background:var(--panel2) center/cover;flex:none;display:grid;place-items:center;font-size:64px;font-weight:700;color:var(--dim);box-shadow:0 16px 40px #0007}
.ahero h1{font-size:38px;margin:2px 0 6px}
.ahero .meta{color:var(--dim)}
.gtile{border-radius:12px;padding:18px 16px;min-height:96px;cursor:pointer;font-weight:700;font-size:17px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.gtile span{font-size:12px;font-weight:500;opacity:.8}
.gtile:hover{filter:brightness(1.15)}
.more-tidal .card .art{opacity:.95}
@media(max-width:760px){.agrid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:16px 12px}.ahero{flex-direction:column;align-items:flex-start;gap:16px}.ahero .pic{width:150px;height:150px}.ahero h1{font-size:30px}}

/* ---------- full-screen now playing ---------- */
.np{cursor:pointer}
#fs{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;color:#fff;
 background:linear-gradient(180deg,var(--fs1,#2a3340) 0%,var(--fs2,#151a20) 55%,#0b0d10 100%);
 transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1),background 1s;overflow:hidden;touch-action:pan-y}
#fs.open{transform:none}
#fs.drag{transition:none}
#fs .top{display:flex;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top)) 16px 4px;position:relative}
#fs .grab{width:42px;height:5px;border-radius:3px;background:#ffffff55}
#fs .from{position:absolute;left:0;right:0;top:calc(22px + env(safe-area-inset-top));text-align:center;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#ffffffaa;pointer-events:none}
#fs .body{flex:1;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:28px 24px calc(20px + env(safe-area-inset-bottom))}
#fs .cover{width:min(84vw,46vh,520px);aspect-ratio:1;border-radius:14px;background:#ffffff14 center/cover;box-shadow:0 24px 60px #0009;flex:none;transition:transform .3s}
#fs.paused .cover{transform:scale(.94)}
#fs .meta{width:min(84vw,520px);margin-top:26px;display:flex;align-items:center;gap:12px}
#fs .meta>div{flex:1;min-width:0}
#fs .ft{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fs .fa{font-size:16px;color:#ffffffcc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fs .falb{font-size:14px;color:#ffffff99;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:100%}
#fs .falb:hover{color:#fff;text-decoration:underline}
#fs .ib{color:#ffffffcc}#fs .ib:hover{background:#ffffff1f;color:#fff}
#fs .ib.on{color:var(--accent)}
#fs .ib.dl.done{color:var(--ok)}#fs .ib.dl.err{color:var(--err)}
#fs .fseek{width:min(84vw,520px);margin-top:18px}
#fs .fseek input{width:100%;accent-color:#fff}
#fs .times{display:flex;justify-content:space-between;font-size:12px;color:#ffffffaa;font-variant-numeric:tabular-nums}
#fs .fctl{width:min(84vw,520px);display:flex;align-items:center;justify-content:space-between;margin-top:10px}
#fs .fctl .big{width:68px;height:68px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center}
#fs .fctl .big svg{width:30px;height:30px}
#fs .fctl .ib{width:48px;height:48px}#fs .fctl .ib svg{width:26px;height:26px}
#fs .fctl .sm svg{width:20px;height:20px}
#fs .rep1{position:relative}#fs .rep1::after{content:"1";position:absolute;font-size:9px;font-weight:800;right:9px;top:9px}
#fs .upnext{width:min(84vw,520px);margin-top:34px}
#fs .upnext h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#ffffffaa;margin:0 0 8px}
#fs .qi{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}
#fs .qi:hover{background:#ffffff14}
#fs .qi .th{width:40px;height:40px;border-radius:5px;background:#ffffff14 center/cover}
#fs .qi .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fs .qi .a{font-size:13px;color:#ffffffaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fs .qi .d{font-size:12px;color:#ffffff88;font-variant-numeric:tabular-nums}
#fs .none{color:#ffffff88;font-size:14px;padding:8px}
@media(min-width:900px) and (min-aspect-ratio:4/3){
 #fs .body{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,440px);gap:56px;align-items:center;padding:20px 6vw 40px;overflow:hidden}
 #fs .left{display:flex;flex-direction:column;align-items:center}
 #fs .cover{width:min(40vw,62vh,560px)}
 #fs .meta,#fs .fseek,#fs .fctl{width:min(40vw,62vh,560px)}
 #fs .upnext{width:100%;margin:0;max-height:78vh;overflow:auto;background:#00000033;border-radius:14px;padding:16px}
}
@media(max-width:899px),(max-aspect-ratio:4/3){ #fs .left{display:contents} }
@media(max-width:760px){
 header{flex-wrap:wrap;padding:10px 12px}.search{order:3;max-width:none;flex-basis:100%}.dots{display:none}
 main{padding:14px 12px 150px}.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
 .row{grid-template-columns:44px minmax(0,1fr) 36px;gap:10px}.row .n,.row .d{display:none}
 .hero{flex-direction:column;align-items:flex-start}.hero .art{width:150px;height:150px}
 footer{grid-template-columns:1fr auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}.right{display:none}.ctl{width:auto}.seek{display:none}
 .qrow{grid-template-columns:1fr 100px}.qrow .bar{display:none}
}
</style>
</head>
<body>
<header>
  <div class="logo">Tide<b>fin</b></div>
  <nav>
    <button data-v="library" class="on">Library</button>
    <button data-v="search">Search</button>
    <button data-v="downloads">Downloads</button>
  </nav>
  <div class="search"><input id="q" type="search" placeholder="Search your library and Tidal…" autocomplete="off"></div>
  <div class="dots"><span class="dot" id="h-jf">Jellyfin</span><span class="dot" id="h-td">Tidarr</span><span class="dot" id="h-ti">Tidal</span></div>
</header>
<main id="main"></main>
<footer>
  <div class="np"><div class="th" id="np-th"></div><div style="min-width:0"><div class="t" id="np-t">Nothing playing</div><div class="a" id="np-a"></div></div></div>
  <div class="ctl">
    <div class="b">
      <button class="ib" id="prev" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
      <button class="play" id="pp" title="Play/Pause"></button>
      <button class="ib" id="next" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
    <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  </div>
  <div class="right">
    <button class="ib dl" id="np-dl" title="Download to library" hidden></button>
    <svg viewBox="0 0 24 24" width="18" fill="currentColor" style="color:var(--dim)"><path d="M3 10v4h4l5 5V5L7 10zm13.5 2A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    <input type="range" id="vol" min="0" max="100" value="90">
  </div>
</footer>
<div id="fs" aria-hidden="true">
  <div class="top"><div class="grab"></div><div class="from" id="fs-from"></div></div>
  <div class="body">
    <div class="left">
      <div class="cover" id="fs-cover"></div>
      <div class="meta">
        <div><div class="ft" id="fs-t"></div><div class="fa" id="fs-a"></div><span class="falb" id="fs-alb"></span></div>
        <button class="ib dl" id="fs-dl" title="Download to library" hidden></button>
      </div>
      <div class="fseek"><input type="range" id="fs-seek" min="0" max="1000" value="0"><div class="times"><span id="fs-cur">0:00</span><span id="fs-dur">0:00</span></div></div>
      <div class="fctl">
        <button class="ib sm" id="fs-shuf" title="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button class="ib" id="fs-prev" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
        <button class="big" id="fs-pp" title="Play/Pause"></button>
        <button class="ib" id="fs-next" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
        <button class="ib sm" id="fs-rep" title="Repeat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
      </div>
    </div>

$('#fs-prev').onclick = () => $('#prev').onclick();

// swipe down to close
let dragY = null, dragStart = 0;

// ---------- ⋯ menu, confirm dialog, delete ----------

function confirmBox(title, text, okLabel) {

async function deleteItem(type, item, after) {

function albumCards(list, src, row = false) {

const normTitle = (x) => (x || '').toLowerCase().normalize('NFKD').replace(/\(.*?\)|\[.*?\]/g, '').replace(/[^a-z0-9]/g, '');
// Studio albums only: skip live albums, compilations, EPs and singles.
const LIVE_RE = /\b(live|unplugged|in concert|concert|on stage|bootleg|tour edition)\b/i;
const COMP_RE = /\b(best of|greatest hits|the very best|collection|anthology|essentials?|the hits|singles|b-sides|rarities|demos?|remixe?s|karaoke|instrumentals?)\b/i;
function studioAlbums(albums) {
  const keep = albums.filter((a) => a.type === 'ALBUM' && !LIVE_RE.test(a.title) && !COMP_RE.test(a.title));
  // one version per album: prefer the one with the most tracks (deluxe/bonus editions), then explicit
  const best = new Map();
  for (const a of keep) {
    const k = normTitle(a.title), o = best.get(k);
    if (!o || (a.tracks || 0) > (o.tracks || 0) || ((a.tracks || 0) === (o.tracks || 0) && a.explicit && !o.explicit)) best.set(k, a);
  }
  return [...best.values()].sort((x, y) => (x.date || x.year || '').localeCompare(y.date || y.year || ''));
}
function discographyPicker(artistName, albums, ownedTitles) {
  const list = studioAlbums(albums);

  const missing = list.filter((x) => !owned(x));

  bgEl.innerHTML = `<div class="modal wide" role="dialog" aria-modal="true">

    <div class="dtools"><span id="dcount"></span><button id="dall">Select all</button><button id="dnone">Select none</button></div>
    <div class="dlist">${list.map((x, i) => { const own = owned(x); return `
      <label class="ditem${own ? ' own' : ''}"><input type="checkbox" data-di="${i}" ${own ? 'disabled' : 'checked'}>
        <div class="c" style="background-image:${bg(x.cover)}"></div>
        <div style="min-width:0"><div class="t">${esc(x.title)}</div><div class="a">${x.year || ''}${x.tracks ? ' · ' + x.tracks + ' songs' : ''}${own ? ' · <span style="color:var(--ok)">✓ in library</span>' : ''}</div></div>
      </label>`; }).join('')}</div>
    <div class="acts"><button class="btn sec" id="dcancel">Cancel</button><button class="btn" id="dgo"></button></div></div>`;
  document.body.appendChild(bgEl);
  const boxes = [...bgEl.querySelectorAll('input[data-di]:not([disabled])')];
  const upd = () => {
    const n = boxes.filter((b) => b.checked).length;
    bgEl.querySelector('#dcount').textContent = `${missing.length} of ${list.length} missing`;
    const go = bgEl.querySelector('#dgo'); go.textContent = n ? `Download ${n} album${n === 1 ? '' : 's'}` : 'Nothing selected'; go.disabled = !n;
  };
  boxes.forEach((b) => b.onchange = upd); upd();
  bgEl.querySelector('#dall').onclick = () => { boxes.forEach((b) => b.checked = true); upd(); };
  bgEl.querySelector('#dnone').onclick = () => { boxes.forEach((b) => b.checked = false); upd(); };
  const close = () => { bgEl.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  bgEl.onclick = (e) => { if (e.target === bgEl) close(); };
  bgEl.querySelector('#dcancel').onclick = close;
  bgEl.querySelector('#dgo').onclick = async () => {
    const pick = boxes.filter((b) => b.checked).map((b) => list[+b.dataset.di]);
    close();
    for (const x of pick) { await download('album', x.id, x.title, x.artist || artistName); await new Promise((r) => setTimeout(r, 300)); }
    toast(`Queued ${pick.length} album${pick.length === 1 ? '' : 's'} by ${artistName} — see Downloads`);
  };
}

    const list = r.tracks.map((t) => ({ ...t, src: 'jf' }));
    const el = $('#lib');
    el.innerHTML = (r.albums.length ? '<div class="sub">Albums</div>' + albumCards(r.albums, 'jf', true) : '') + (list.length ? '<div class="sub">Songs</div>' + trackRows(list) : (r.albums.length ? '' : '<div class="empty">Nothing in your library</div>'));
    bindCards(el, r.albums, 'jf'); bindRows(el, list);
  }).catch((e) => { if ($('#lib')) $('#lib').innerHTML = errBox(e); });
  api(`/api/tidal/search?q=${encodeURIComponent(q)}`).then((r) => {
    if (q !== lastQ || view.name !== 'search') return;
    const list = r.tracks.map((t) => ({ ...t, src: 'tidal' }));
    const el = $('#tid');
    el.innerHTML = (r.albums.length ? '<div class="sub">Albums · ↓ downloads the whole album</div>' + albumCards(r.albums, 'tidal', true) : '') +
      (list.length ? '<div class="sub">Songs</div>' + trackRows(list) : '') + (!list.length && !r.albums.length ? '<div class="empty">Nothing found on Tidal</div>' : '');
    bindRows(el, list); bindCards(el, r.albums, 'tidal');
  }).catch((e) => { if ($('#tid')) $('#tid').innerHTML = errBox(e); });
}

function renderDownloads() {
  const label = { queue_download: 'Queued', download: 'Downloading', queue_processing: 'Waiting', processing: 'Processing', finished: 'Done', error: 'Failed' };
  const items = queueCache;
  main.innerHTML = `<h2>Tidarr queue <span class="tag">${items.length}</span>
    <span style="margin-left:auto;display:flex;gap:6px"><button class="btn sec" id="rf">Retry failed</button><button class="btn sec" id="cf">Clear finished</button></span></h2>
    ${items.length ? items.map((i) => `<div class="qrow"><div style="min-width:0"><div class="rt" style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.title || (i.type + ' ' + i.id))}</div><div class="ra" style="color:var(--dim);font-size:13px">${esc(i.artist)} ${i.type ? '· ' + esc(i.type) : ''}</div></div>
      <span class="st ${esc(i.status)}">${label[i.status] || esc(i.status)}</span>
      <div class="bar"><i style="width:${i.status === 'finished' ? 100 : (typeof i.progress === 'number' ? Math.min(100, i.progress) : (i.status === 'download' || i.status === 'processing') ? 50 : 0)}%"></i></div></div>`).join('') : '<div class="empty">The queue is empty. Search Tidal and press ↓ on a song or album.</div>'}`;
  $('#rf').onclick = async () => { try { await api('/api/queue/retry', { method: 'POST' }); pollQueue(); } catch (e) { toast(e.message, true); } };
  $('#cf').onclick = async () => { try { await api('/api/queue/clear-finished', { method: 'POST' }); pollQueue(); } catch (e) { toast(e.message, true); } };
}

document.querySelectorAll('nav button').forEach((b) => b.onclick = () => { history_ = []; go(b.dataset.v, {}, false); if (b.dataset.v === 'downloads') pollQueue(); });
let qT;
$('#q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => { history_ = []; go('search', {}, false); }, 400); });
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(qT); history_ = []; go('search', {}, false); } });

api('/api/health').then((h) => {
  $('#h-jf').classList.toggle('up', h.jellyfin); $('#h-td').classList.toggle('up', h.tidarr); $('#h-ti').classList.toggle('up', h.tidal);
  const e = h.errors || {};
  $('#h-jf').title = e.jellyfin || 'OK'; $('#h-td').title = e.tidarr || 'OK'; $('#h-ti').title = e.tidal || 'OK';
  if (Object.keys(e).length) {
    const box = document.createElement('div');
    box.style.cssText = 'background:#2a1414;border:1px solid var(--err);border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px';
    box.innerHTML = '<b>Connection problems</b><br>' + Object.entries(e).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join('<br>') +
      `<br><span style="color:var(--dim)">Config: ${esc(JSON.stringify(h.config))}</span>`;
    main.prepend(box);
  }
}).catch(() => {});
loadLibIndex();
go('library', {}, false);
pollQueue();
</script>
</body>
</html>
